/* Refined operations dashboard: stronger contrast, consistent sizing, and clearer hierarchy. */
:root{
  --brand:#075985;
  --brand-dark:#0c3f60;
  --brand-soft:#e8f3f9;
  --page:#eef3f7;
  --line:#c7d3dc;
  --line-strong:#9fb2c1;
  --ink:#102a3a;
  --muted:#536b7a;
  --white:#fff;
  --waiting:#0e7490;
  --progress:#075985;
  --hotel:#be123c;
  --radius:12px;
  --shadow:0 8px 24px rgba(15,42,58,.08);
}
body{
  font-size:15px;
  line-height:1.5;
  background:var(--page);
}
.sidebar{
  width:240px;
  transition:width .22s ease;
  padding:30px 18px 22px;
  background:linear-gradient(180deg,#0c4a6e 0%,#082f49 100%);
  box-shadow:4px 0 18px rgba(8,47,73,.18);
}
body{padding-left:240px;transition:padding-left .22s ease}
.brand{font-size:25px;text-decoration:none}
.kicker{font-size:11px;color:#d8eaf3}
.nav{gap:10px}
.nav button,.side-action{
  min-height:48px;
  border-radius:9px;
  font-size:14px;
}
.nav button:hover,.nav button.active{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.14);
  box-shadow:inset 4px 0 #fb7185;
}
.nav button::before{content:attr(data-icon);flex:0 0 18px;width:18px;text-align:center;font-size:17px;line-height:1}
.nav .count{background:rgba(255,255,255,.16)}
.sidebar-toggle{
  position:absolute;
  top:50%;
  right:-18px;
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  padding:0;
  transform:translateY(-50%);
  border:3px solid #fff;
  border-radius:50%;
  color:#fff;
  background:#1769c2;
  box-shadow:0 4px 12px rgba(8,47,73,.28);
  z-index:11;
}
.sidebar-toggle:hover{background:#0f55a0}
.sidebar-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;transition:transform .22s ease}
.sidebar.collapsed{width:76px;padding-inline:12px}
body.sidebar-collapsed{padding-left:76px}
.sidebar.collapsed .brand{padding-inline:0;font-size:0;text-align:center}
.sidebar.collapsed .brand::after{content:"MU";font-size:19px;letter-spacing:.05em}
.sidebar.collapsed .kicker,.sidebar.collapsed .nav-label,.sidebar.collapsed .side-label{display:none}
.side-bottom .live-status{margin:0;padding:10px 14px;color:#dcecf9}
.sidebar.collapsed .live-status{justify-content:center;padding-inline:0;font-size:0}
.sidebar.collapsed .nav button,.sidebar.collapsed .side-action{justify-content:center;padding-inline:7px}
.sidebar.collapsed .nav .count{margin-left:0}
.sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg)}
.workspace{padding:28px}
.card{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  min-height:calc(100vh - 56px);
  padding:26px;
  border-color:#d4dee5;
  border-radius:16px;
  background:#fff;
  box-shadow:var(--shadow);
}
.topbar{min-height:48px;margin-bottom:22px}
.live-status{display:inline-flex;align-items:center;gap:7px;margin-left:4px;color:#426173;font-size:12px;font-weight:800;white-space:nowrap}
.live-status::before{content:"";width:8px;height:8px;border-radius:50%;background:#d39b16;box-shadow:0 0 0 3px rgba(211,155,22,.14)}
.live-status.connected::before{background:#16835d;box-shadow:0 0 0 3px rgba(22,131,93,.14)}
.live-status.reconnecting::before{animation:live-pulse 1.2s ease-in-out infinite}
@keyframes live-pulse{50%{opacity:.35}}
.topbar h1{font-size:28px;line-height:1.2;color:#0b3047}
.search{
  width:min(420px,100%);
  min-height:46px;
  padding:11px 15px;
  border-color:var(--line-strong);
  border-radius:9px;
  font-size:15px;
}
.search::placeholder{color:#6b7f8c;opacity:1}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(7,89,133,.14)}
.summary{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  width:100%;
  margin-bottom:22px;
}
.summary button{
  grid-template-columns:1fr auto;
  width:100%;
  min-height:92px;
  padding:18px 20px;
  border-color:var(--line);
  border-radius:var(--radius);
  background:#f8fafc;
  box-shadow:0 2px 6px rgba(15,42,58,.04);
}
.summary button:hover{border-color:#7fa6bc;background:#f2f8fb}
.summary button.active{border:2px solid var(--waiting);background:#edf8fb}
.summary button[data-view="In Progress"].active{background:#eaf4f8}
.summary button[data-view="Case Closed"].active{background:#fff1f2}
.summary b{font-size:15px}
.summary strong{font-size:30px;line-height:1;color:#0b4f72;font-variant-numeric:tabular-nums}
.panel{border-color:var(--line);border-radius:var(--radius);background:#fff}
.panel-title{
  min-height:52px;
  padding:13px 18px;
  border-bottom:1px solid var(--line);
  background:#eaf2f7;
  color:#17384b;
  font-size:16px;
}
.head{
  grid-template-columns:90px 72px minmax(220px,1.4fr) minmax(190px,1fr) minmax(130px,.7fr);
  min-height:92px;
  gap:18px;
  padding:17px 18px;
}
.head.no-member{grid-template-columns:90px minmax(220px,1.4fr) minmax(190px,1fr) minmax(130px,.7fr)}
.head:hover{background:#f3f8fb}
.head>div{min-width:0;overflow-wrap:anywhere}
.label{margin-bottom:5px;color:#567080;font-size:11px;font-weight:800}
.bn{color:#075985;font-size:23px}
.pill{padding:6px 10px;background:#e4f2f7;color:#075985}
.passenger-name{display:block}
.member-cell{text-align:center}
.member-cell .label{text-align:center}
.member-badge{display:inline-grid;place-items:center;width:34px;height:30px;border:1px solid currentColor;border-radius:8px;box-shadow:inset 0 1px rgba(255,255,255,.6)}
.member-badge svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;stroke-width:1.5}
.member-badge.platinum{color:#374151;background:linear-gradient(145deg,#f8fafc,#cbd5e1)}
.member-badge.gold{color:#704500;background:linear-gradient(145deg,#fff4a8,#eab629)}
.member-badge.silver{color:#405565;background:linear-gradient(145deg,#f3f7fa,#b8c7d2)}
.member-badge.elite-plus{color:#fff;background:linear-gradient(145deg,#5145b8,#2e207d);border-color:#6d5bd0}
.member-badge.elite{color:#fff;background:linear-gradient(145deg,#2684d7,#075da9);border-color:#4a9ee5}
.detail{padding:20px;background:#f3f7fa}
.case-layout{grid-template-columns:minmax(290px,340px) minmax(0,1fr);gap:18px}
.progress-card,.conversation,.records,.update-panel,.workflow,.box{
  border-color:var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(15,42,58,.04);
}
.progress-card,.conversation,.records,.update-panel{padding:18px}
.case-main{gap:14px}
.grid{gap:14px}
.box{min-height:88px;padding:14px;background:#fff}
.update-panel .edit{grid-template-columns:210px minmax(0,1fr) 112px;gap:12px;align-items:start}
.action-fields{gap:12px}
.edit input,.edit select,.edit textarea,.chat-form input{
  min-height:46px;
  border-color:var(--line-strong);
  border-radius:8px;
  color:var(--ink);
  background:#fff;
}
.edit input:focus,.edit select:focus,.edit textarea:focus,.chat-form input:focus{
  outline:0;
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(7,89,133,.12);
}
.update{min-width:104px;min-height:46px;border-radius:8px;background:var(--brand)}
.update:hover{background:var(--brand-dark)}
.workflow-steps{gap:10px}
.workflow-step{min-height:58px;padding:11px 12px}
.record-screen{font-size:13px;line-height:1.55}
.pager{min-height:62px}
.pager button{min-width:90px;min-height:38px;border-color:var(--line-strong)}
.empty{padding:52px 24px}
@media(max-width:1100px){
  .head{grid-template-columns:80px 66px minmax(180px,1fr) minmax(160px,1fr) 120px}
  .head.no-member{grid-template-columns:80px minmax(180px,1fr) minmax(160px,1fr) 120px}
  .case-layout{grid-template-columns:1fr}
  .progress-card .workflow-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  body{padding-left:0;font-size:14px}
  .sidebar,.sidebar.collapsed{width:100%;padding:12px;box-shadow:0 3px 12px rgba(8,47,73,.18)}
  body.sidebar-collapsed{padding-left:0}
  .sidebar-toggle{display:none}
  .sidebar.collapsed .brand{font-size:17px;text-align:left}
  .sidebar.collapsed .brand::after{content:none}
  .workspace{padding:10px}
  .card{min-height:calc(100vh - 74px);padding:14px;border-radius:12px}
  .topbar h1{font-size:24px}
  .live-status{margin-left:0}
  .search{order:3}
  .summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .summary button{display:flex;min-height:76px;padding:11px;flex-direction:column;align-items:flex-start;justify-content:space-between}
  .summary b{font-size:12px}
  .summary strong{font-size:24px}
  .head{grid-template-columns:72px minmax(0,1fr);min-height:82px;gap:12px;padding:14px}
  .head.has-member>div:nth-child(2),.head.has-member>div:nth-child(n+4),.head.no-member>div:nth-child(n+3){display:none}
  .detail{padding:12px}
  .grid,.edit,.hotel-fields,.case-layout,.update-panel .edit{grid-template-columns:1fr}
  .progress-card .workflow-steps{grid-template-columns:1fr}
  .update{width:100%}
}
@media(max-width:460px){
  .brand{padding-left:5px;font-size:17px}
  .nav button{padding:8px;min-height:42px}
  .summary{grid-template-columns:1fr}
  .summary button{min-height:64px;flex-direction:row;align-items:center}
}
</style></head>
<body>
<aside class="sidebar" id="sidebar"><a class="brand" href="index.html">MUIRR</a><div class="kicker">Passenger Operations</div><nav class="nav" aria-label="Case status"><button class="active" data-view="Waiting" data-icon="◷"><span class="nav-label">Waiting</span><b class="count">0</b></button><button data-view="In Progress" data-icon="↻"><span class="nav-label">In Progress</span><b class="count">0</b></button><button data-view="Hotel" data-icon="H"><span class="nav-label">Hotel</span><b class="count" data-count="Hotel">0</b></button><button data-view="Case Closed" data-icon="✓"><span class="nav-label">Case Closed</span><b class="count">0</b></button></nav><button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><div class="side-bottom"><span class="live-status reconnecting" id="live-status" role="status">Connecting…</span><button class="side-action" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6 9a7 7 0 0 1 12-3l2 5M4 13l2 5a7 7 0 0 0 12-3"/></svg><span class="side-label">Refresh</span></button><button class="side-action" id="logout"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 9l4 3-4 3M18 12H9"/></svg><span class="side-label">Logout</span></button></div></aside>
<main class="workspace"><section class="card"><div class="topbar"><h1 id="title">Waiting</h1><input class="search" id="search" placeholder="Search BN, name, ticket…"></div><div class="summary"><button class="active" data-view="Waiting"><span><b>Waiting</b></span><strong data-count="Waiting">0</strong></button><button data-view="In Progress"><span><b>In Progress</b></span><strong data-count="In Progress">0</strong></button><button data-view="Case Closed"><span><b>Case Closed</b></span><strong data-count="Case Closed">0</strong></button></div><section class="panel"><div class="panel-title" id="panel-title">Waiting <span>(0)</span></div><div class="cases" id="cases"><div class="empty">Loading cases…</div></div><div class="pager" id="pager"></div></section></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js" onerror="this.remove()"></script><script>
const apiBase=(window.MU_API_BASE||'https://api.mufcapp.net').replace(/\/$/,''),casesEl=document.querySelector('#cases'),search=document.querySelector('#search'),pager=document.querySelector('#pager');let rows=[],expanded=new Set(),loading=false,currentView='Waiting',page=1,recordPages=new Map();const PAGE_SIZE=8;
const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));function loginUrl(){const url=new URL('login.html',location.href);url.searchParams.set('next',location.pathname+location.search);return url.href}const auth=window.firebase?.apps?.length&&window.firebase?.auth?firebase.auth():null;if(auth)auth.onAuthStateChanged(user=>{if(!user)location.replace(loginUrl())});
const statuses=['Waiting','In Progress','Case Closed'];const hasHotel=row=>Boolean(row.hotelReservationNumber||row.caseWorkflow?.hotelRequested||row.caseWorkflow?.hotelProvided);const normalizedStatus=row=>['Closed','Completed'].includes(row.status)?'Case Closed':statuses.includes(row.status)?row.status:'Waiting';const fmt=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?String(value||''):date.toLocaleString()};
function selectView(view){currentView=view;page=1;document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));document.querySelector('#title').textContent=view;render()}
function historyHtml(row){const history=Array.isArray(row.caseHistory)?row.caseHistory:[];const events=history.slice().reverse();return events.length?events.map(item=>`<div class="event ${item.type==='message'?'message':''}"><strong>${esc(item.type==='message'?'Message':item.status||'Update')}</strong>${item.message?`<span>${esc(item.message)}</span>`:''}<small>${esc(fmt(item.at))} · ${esc(item.by||'Agent')}</small></div>`).join(''):'<p class="empty">No progress recorded.</p>'}
function membershipType(row){const match=String(row.pnrRecord||'').match(/FF\/([A-Z0-9]+)\s+\d+\/([VGS])/i);if(!match)return '';const carrier=match[1].toUpperCase(),tier=match[2].toUpperCase();if(carrier==='MU'&&tier==='V')return 'Platinum';if(carrier==='MU'&&tier==='G')return 'Gold';if(carrier==='MU'&&tier==='S')return 'Silver';if(['V','G'].includes(tier))return 'Elite Plus';if(tier==='S')return 'Elite';return ''}
function membershipHtml(row){const type=membershipType(row);if(!type)return '<span aria-hidden="true">—</span>';const icon=type==='Elite Plus'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 3 1.5 4.5H13L9.4 10l1.4 4.5L7 11.8l-3.8 2.7L4.6 10 1 7.5h4.5L7 3Zm10 4 1.2 3.6H22l-3.1 2.2 1.2 3.7-3.1-2.3-3.1 2.3 1.2-3.7-3.1-2.2h3.8L17 7Z"/></svg>':type==='Elite'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3-4.6-4.5 6.4-.9L12 2.8Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 5 4 4-8 4 8 5-4-2 11H5L3 7Z"/><path d="M6 21h12" fill="none"/></svg>';return `<span class="member-badge ${type.toLowerCase().replace(' ','-')}" title="${type}" aria-label="${type} member">${icon}</span>`}
function chatHtml(row){const messages=(Array.isArray(row.caseHistory)?row.caseHistory:[]).map((item,index)=>({...item,historyIndex:index})).filter(item=>item.type==='message');return messages.length?messages.map(item=>`<div class="bubble"><button type="button" class="delete-message" data-delete-message="${item.historyIndex}" aria-label="Delete message">−</button>${esc(item.message)}<small>${esc(item.by||'Agent')} · ${esc(fmt(item.at))}</small></div>`).join(''):'<p class="empty">No messages yet. Start the case conversation below.</p>'}
function recordsHtml(row){const companions=String(row.companionPnrRecords||'').split(/\n\n(?=BN\s)/).filter(Boolean),records=[{label:'Record - PNR',text:row.pnrRecord||'No PNR record'},...(row.newTicketNumber?[{label:'Record - TKT',text:row.newTicketNumber}]:[]),...companions.map((text,index)=>({label:`Companion ${index+1}`,text}))];const selected=Math.min(recordPages.get(row.rowNumber)||0,records.length-1),item=records[selected];return `<section class="records"><h3>Records</h3><div class="record-tabs">${records.map((record,index)=>`<button type="button" class="${index===selected?'active':''}" data-record-page="${index}">${esc(record.label)}</button>`).join('')}</div><pre class="record-screen">${esc(item.text)}</pre><p class="record-page-label">Record ${selected+1} of ${records.length}</p></section>`}

function workflowHtml(row){const flow=row.caseWorkflow||{},closed=normalizedStatus(row)==='Case Closed',steps=[{key:'passengerConfirmed',label:`Confirm with passenger${flow.requestType?` — ${flow.requestType}`:''}`,done:flow.passengerConfirmed}];if(flow.passengerConfirmed&&!flow.requestType)steps.push({key:'requestChoice',label:'Select rebooking or refund',done:false});if(flow.requestType==='rebooking')steps.push({key:'itineraryDelivered',label:'Provide new itinerary',done:flow.itineraryDelivered});if(flow.requestType==='refund')steps.push({key:'refundRequested',label:'Provide refund information',done:flow.refundRequested});if(flow.hotelRequested||flow.hotelProvided){steps.push({key:'hotelRequested',label:'Request hotel',done:flow.hotelRequested||flow.hotelProvided},{key:'hotelProvided',label:'Provide hotel reservation',done:flow.hotelProvided},{key:'hotelConfirmationDelivered',label:'Provide hotel confirmation',done:flow.hotelConfirmationDelivered})}steps.push({key:'caseClosed',label:'Close case',done:flow.caseClosed||closed});let current='';if(!closed){if(!flow.passengerConfirmed)current='passengerConfirmed';else if(!flow.requestType)current='requestChoice';else if(flow.hotelRequested&&!flow.hotelProvided)current='hotelProvided';else if(flow.hotelProvided&&!flow.hotelConfirmationDelivered)current='hotelConfirmationDelivered';else if(flow.requestType==='rebooking'&&!flow.itineraryDelivered)current='itineraryDelivered';else if(flow.requestType==='refund'&&!flow.refundRequested)current='refundRequested';else current='caseClosed'}return `<section class="workflow"><h3>Case Workflow</h3><div class="workflow-steps">${steps.map(step=>`<div class="workflow-step ${step.done?'done':step.key===current?'current':''}"><span>${step.label}${step.done?`<small>${esc(fmt(step.done.at))} · ${esc(step.done.by)}</small>`:step.key===current?'<small>Current stage</small>':''}</span></div>`).join('')}</div></section>`}

function render(){for(const view of statuses){const count=rows.filter(row=>normalizedStatus(row)===view).length;document.querySelectorAll(`[data-count="${view}"],.nav [data-view="${view}"] .count`).forEach(el=>el.textContent=count)}document.querySelectorAll('[data-count="Hotel"]').forEach(el=>el.textContent=rows.filter(hasHotel).length);const q=search.value.trim().toLowerCase();let all=rows.filter(row=>(currentView==='Hotel'?hasHotel(row):normalizedStatus(row)===currentView)&&Object.values(row).join(' ').toLowerCase().includes(q)).slice().reverse();if(currentView==='Waiting')all=[...all.filter(membershipType),...all.filter(row=>!membershipType(row))];const pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));page=Math.min(page,pages);const visible=all.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);document.querySelector('#panel-title').innerHTML=`${esc(currentView)} <span>(${all.length})</span>`;pager.innerHTML=`<button data-page="${page-1}" ${page===1?'disabled':''}>Previous</button><b>Page ${page} / ${pages}</b><button data-page="${page+1}" ${page===pages?'disabled':''}>Next</button>`;if(!visible.length){casesEl.innerHTML='<div class="empty">No matching cases.</div>';return}casesEl.innerHTML=visible.map(row=>{const open=expanded.has(row.rowNumber),member=membershipType(row);return `<article class="case ${open?'open':''}" data-row="${row.rowNumber}"><div class="head ${member?'has-member':'no-member'}" data-toggle><div><span class="label">BN</span><span class="bn">${esc(row.bn)}</span></div>${member?`<div class="member-cell"><span class="label">Member</span>${membershipHtml(row)}</div>`:''}<div><span class="label">Passenger</span><strong class="passenger-name">${esc(row.passengerName)||'—'}</strong></div><div><span class="label">New Ticket Number</span><strong>${esc(row.newTicketNumber)||'—'}</strong></div><div><span class="label">Status</span><span class="pill">${esc(normalizedStatus(row))}</span></div></div><div class="detail"><div class="case-layout"><aside class="progress-card">${workflowHtml(row)}</aside><div class="case-main"><div class="grid"><div class="box"><span class="label">Contact</span>${esc(row.phone)}<br>${esc(row.email)}</div><div class="box"><span class="label">Travel party / Companion BN</span>${esc(row.travelParty)} · ${esc(row.companionBns)||'—'}</div><div class="box wide"><span class="label">Passenger intention</span>${esc(row.intention)}</div></div><section class="update-panel"><h3>Update</h3><form class="edit"><label><span>Workflow action</span><select name="action"><option value="confirmPassenger">Confirm with Passenger</option><option value="newTicket">Provide New Itinerary / New Ticket Number</option><option value="manualPnr">Manually Update PNR Record</option><option value="manualTkt">Manually Update TKT Record</option>${currentView==='Hotel'?'<option value="hotel">Provide Hotel</option><option value="hotelDelivered">Hotel Confirmation Provided</option>':'<option value="requestHotel">Request Hotel</option>'}<option value="refund">Passenger Wants Refund / Provide Guidance</option><option value="comment">Comment</option><option value="caseClose">Case Close</option></select></label><div class="action-fields"><label data-action-field="confirmPassenger"><span>Passenger selected *</span><select name="requestType"><option value="">Select one</option><option value="rebooking">Rebooking</option><option value="refund">Refund</option></select></label><label data-action-field="confirmPassenger"><span>Confirmation note</span><textarea name="confirmationNote" placeholder="What was confirmed with the passenger?"></textarea></label><label data-action-field="newTicket" hidden><span>New Ticket Number *</span><input name="newTicketNumber" value="${esc(row.newTicketNumber)}" placeholder="New ticket number"></label><label data-action-field="manualPnr" hidden><span>PNR Record *</span><textarea name="pnrRecord" placeholder="Paste the correct PNR record">${esc(row.pnrRecord)}</textarea></label><label data-action-field="manualTkt" hidden><span>TKT Record / Ticket Number *</span><input name="manualTicketNumber" value="${esc(row.newTicketNumber)}" placeholder="Correct ticket record or number"></label><label data-action-field="hotel" hidden><span>Reservation Number *</span><input name="hotelReservationNumber" value="${esc(row.hotelReservationNumber)}"></label><label data-action-field="hotel" hidden><span>Price (optional)</span><input name="hotelPrice" value="${esc(row.hotelPrice)}" inputmode="decimal"></label><p data-action-field="hotelDelivered" hidden>Confirm the hotel reservation was provided to the passenger.</p><p data-action-field="refund" hidden>Record that refund information was provided or the passenger was referred to the original ticketing channel.</p><label data-action-field="comment" hidden><span>Comment</span><textarea name="comment" placeholder="Comment / 留言">${esc(row.comment)}</textarea></label><p data-action-field="caseClose" hidden>Close this case after all required work is complete.</p></div><input type="hidden" name="expectedUpdatedAt" value="${esc(row.updatedAt)}"><button class="update">Update</button></form></section><section class="conversation"><h3>Case Conversation</h3><div class="chat-log">${chatHtml(row)}</div><form class="chat-form"><input name="chatMessage" maxlength="1000" placeholder="Write a message…" required><button class="update">Send</button></form></section>${recordsHtml(row)}</div></div><small class="updated">Last update: ${esc(fmt(row.updatedAt)||'—')} ${row.updatedBy?'by '+esc(row.updatedBy):''}</small></div></article>`}).join('')}
const sidebar=document.querySelector('#sidebar'),sidebarToggle=document.querySelector('#sidebar-toggle');function setSidebarCollapsed(collapsed){sidebar.classList.toggle('collapsed',collapsed);document.body.classList.toggle('sidebar-collapsed',collapsed);sidebarToggle.setAttribute('aria-expanded',String(!collapsed));sidebarToggle.setAttribute('aria-label',collapsed?'Expand sidebar':'Collapse sidebar');sidebarToggle.title=collapsed?'Expand sidebar':'Collapse sidebar';localStorage.setItem('muirr-sidebar-collapsed',String(collapsed))}setSidebarCollapsed(localStorage.getItem('muirr-sidebar-collapsed')==='true');sidebarToggle.onclick=()=>setSidebarCollapsed(!sidebar.classList.contains('collapsed'));document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>selectView(button.dataset.view));pager.onclick=event=>{const button=event.target.closest('[data-page]');if(!button||button.disabled)return;page=Number(button.dataset.page);render()};casesEl.onclick=async event=>{const deleteButton=event.target.closest('[data-delete-message]');if(deleteButton){if(!confirm('Delete this message?'))return;const article=deleteButton.closest('.case'),rowNumber=Number(article.dataset.row);deleteButton.disabled=true;try{const response=await fetch(`${apiBase}/irr-cases/${rowNumber}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deleteMessageIndex:Number(deleteButton.dataset.deleteMessage),updatedBy:auth?.currentUser?.email||'Agent'})}),result=await response.json();if(!response.ok)throw new Error(result.error);rows=rows.map(row=>row.rowNumber===rowNumber?result.record:row);selectView(normalizedStatus(result.record))}catch(error){alert(error.message)}return}const recordButton=event.target.closest('[data-record-page]');if(recordButton){const article=recordButton.closest('.case');recordPages.set(Number(article.dataset.row),Number(recordButton.dataset.recordPage));render();return}const toggle=event.target.closest('[data-toggle]');if(!toggle)return;const number=Number(toggle.closest('.case').dataset.row);expanded.has(number)?expanded.delete(number):expanded.add(number);render()};casesEl.onchange=event=>{if(event.target.name!=='action')return;const form=event.target.closest('.edit');form.querySelectorAll('[data-action-field]').forEach(field=>field.hidden=field.dataset.actionField!==event.target.value)};casesEl.onsubmit=async event=>{event.preventDefault();const form=event.target,rowNumber=Number(form.closest('.case').dataset.row),button=form.querySelector('button'),body=Object.fromEntries(new FormData(form)),isChat=form.classList.contains('chat-form');if(!isChat&&body.action==='confirmPassenger'&&!body.requestType){alert('Please select rebooking or refund.');return}if(!isChat&&body.action==='newTicket'&&!body.newTicketNumber.trim()){alert('Please enter the new ticket number.');return}if(!isChat&&body.action==='manualPnr'&&!body.pnrRecord.trim()){alert('Please enter the PNR record.');return}if(!isChat&&body.action==='manualTkt'){body.newTicketNumber=body.manualTicketNumber;if(!body.newTicketNumber.trim()){alert('Please enter the TKT record or ticket number.');return}}if(!isChat&&body.action==='hotel'&&!body.hotelReservationNumber.trim()){alert('Please enter the hotel reservation number.');return}if(!isChat&&body.action==='refund')body.passengerWantsRefund='Yes';if(!isChat){for(const key of Object.keys(body)){if(!['action','expectedUpdatedAt','updatedBy','passengerWantsRefund','newTicketNumber'].includes(key)&&!form.querySelector(`[name="${key}"]`)?.closest(`[data-action-field="${body.action}"]`))delete body[key]}}delete body.manualTicketNumber;body.updatedBy=auth?.currentUser?.email||'Agent';button.disabled=true;button.textContent=isChat?'Sending…':'Saving…';try{const response=await fetch(`${apiBase}/irr-cases/${rowNumber}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw new Error(result.error);rows=rows.map(row=>row.rowNumber===rowNumber?result.record:row);selectView(body.action==='requestHotel'?'Hotel':normalizedStatus(result.record))}catch(error){alert(error.message)}finally{if(button.isConnected){button.disabled=false;button.textContent=isChat?'Send':'Update'}}};
async function load(){if(loading)return;loading=true;try{const response=await fetch(`${apiBase}/irr-cases`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error);rows=data.rows||[];render()}catch(error){casesEl.innerHTML=`<div class="empty">${esc(error.message)}</div>`}finally{loading=false}}
const liveStatus=document.querySelector('#live-status');function setLiveStatus(text,state){liveStatus.textContent=text;liveStatus.className=`live-status ${state||''}`.trim()}function connectLiveSync(){if(!window.EventSource){setLiveStatus('Periodic sync','');return}const stream=new EventSource(`${apiBase}/irr-cases/stream`);stream.onopen=()=>setLiveStatus('Live','connected');stream.addEventListener('cases',event=>{try{const data=JSON.parse(event.data);rows=Array.isArray(data.rows)?data.rows:[];render();setLiveStatus('Live','connected')}catch(_){setLiveStatus('Sync error','reconnecting')}});stream.addEventListener('case-update',event=>{try{const record=JSON.parse(event.data).record;if(!record)return;const index=rows.findIndex(row=>row.rowNumber===record.rowNumber);if(index===-1)rows.push(record);else rows[index]=record;render();setLiveStatus('Live','connected')}catch(_){setLiveStatus('Sync error','reconnecting')}});stream.addEventListener('sync-error',()=>setLiveStatus('Reconnecting…','reconnecting'));stream.onerror=()=>setLiveStatus('Reconnecting…','reconnecting')}
search.oninput=()=>{page=1;render()};document.querySelector('#refresh').onclick=async event=>{const button=event.currentTarget;button.disabled=true;await load();button.disabled=false};document.querySelector('#logout').onclick=()=>auth?auth.signOut().then(()=>location.replace(loginUrl())):location.replace(loginUrl());load();connectLiveSync();setInterval(()=>{if(liveStatus.textContent!=='Live')load()},30000);
</script></body></html>
