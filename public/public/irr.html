<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUIRR Case Center</title>
<style>
:root{--brand:#176b52;--brand2:#24906f;--page:#f0faf6;--line:#cee4db;--ink:#123d31;--muted:#607c72;--white:#fff;--waiting:#259a73;--progress:#207f62;--hotel:#15664f}*{box-sizing:border-box}html,body{max-width:100%;min-height:100%;overflow-x:hidden}body{margin:0;padding-left:224px;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(120deg,#edf9f4,#fbfefd)}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:224px;display:flex;flex-direction:column;padding:28px 16px 22px;color:#fff;background:linear-gradient(180deg,#176b52,#0d4938);box-shadow:8px 0 28px #145d471c;z-index:10}.brand{padding:0 12px 5px;color:#fff;font-size:23px;font-weight:950;letter-spacing:.12em}.kicker{padding:0 12px 17px;color:#c8eadf;font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:8px}.nav button,.side-action{display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border:1px solid transparent;border-radius:11px;color:#e7f7f1;background:transparent;font-weight:800;text-align:left}.nav button:hover,.nav button.active{border-color:#78c8ae;background:#ffffff20;color:#fff;box-shadow:inset 3px 0 #91ddc4}.nav svg,.side-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}.nav .count{margin-left:auto;min-width:25px;padding:2px 7px;border-radius:999px;background:#ffffff20;text-align:center;font-size:12px}.side-bottom{display:grid;gap:4px;margin-top:auto}.side-action{border:0}.workspace{min-height:100vh;padding:25px 28px}.card{min-height:calc(100vh - 50px);padding:22px;border:1px solid var(--line);border-radius:20px;background:#ffffffee;box-shadow:0 18px 42px #163d6812}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:18px}.topbar h1{margin:0;font-size:25px}.search{margin-left:auto;width:min(330px,100%);padding:11px 14px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff;outline:0}.search:focus{border-color:#259a73;box-shadow:0 0 0 3px #259a731c}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,250px));gap:13px;margin-bottom:20px}.summary button{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;min-height:90px;padding:15px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#f7fcfa;text-align:left}.summary button.active{border:2px solid var(--waiting);background:#edf9f4}.summary button[data-view="In Progress"].active{border-color:var(--progress);background:#e8f6f0}.summary button[data-view="Hotel"].active{border-color:var(--hotel);background:#e5f4ee}.summary .icon{display:grid;place-items:center;width:37px;height:37px;border-radius:10px;color:#fff;background:var(--waiting);font-size:18px}.summary button[data-view="In Progress"] .icon{background:var(--progress)}.summary button[data-view="Hotel"] .icon{background:var(--hotel)}.summary small{display:block;color:var(--muted);font-weight:750}.summary strong{font-size:28px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:16px}.panel-title{display:flex;align-items:center;padding:12px 15px;background:#dcefe7;font-weight:900}.panel-title span{margin-left:6px}.cases{display:grid}.empty{padding:45px;text-align:center;color:var(--muted)}.case{border-top:1px solid var(--line);background:#fff}.case:first-child{border-top:0}.head{display:grid;grid-template-columns:80px minmax(150px,1.2fr) minmax(100px,.7fr) minmax(100px,.7fr) 80px;gap:14px;align-items:center;padding:15px;cursor:pointer}.head:hover{background:#f3fbf8}.label{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.bn{color:#168260;font-size:23px;font-weight:950}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dff2ea;color:#176b52;font-size:12px;font-weight:850}.detail{display:none;padding:17px;border-top:1px solid var(--line);background:#f8fcfa}.case.open .detail{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{padding:12px;border:1px solid var(--line);border-radius:10px;background:white;white-space:pre-wrap;overflow-wrap:anywhere}.wide{grid-column:1/-1}.edit{display:grid;grid-template-columns:180px 1fr 2fr auto;gap:10px;margin-top:14px}.edit input,.edit select,.edit textarea{width:100%;padding:11px;border:1px solid #bed0e2;border-radius:9px;background:#fff;color:var(--ink)}.edit textarea{min-height:44px;resize:vertical}.update{border:0;border-radius:9px;padding:11px 18px;color:white;background:var(--brand);font-weight:900}.hotel-fields{display:none;grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:13px;border:1px solid #a9d7c7;border-radius:11px;background:#edf9f4}.edit.hotel-selected .hotel-fields{display:grid}.hotel-fields label{color:var(--muted);font-size:11px;font-weight:850}.hotel-fields label span{display:block;margin-bottom:5px}.hotel-address{grid-column:span 2}.updated{display:block;margin-top:10px;color:var(--muted)}
.summary{grid-template-columns:repeat(4,minmax(0,220px))}.summary button[data-view="Case Closed"].active{border-color:#12503e;background:#dff1e9}.case-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:15px}.progress-card,.conversation{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.progress-card h3,.conversation h3{margin:0 0 13px}.timeline{display:grid;gap:10px;max-height:440px;overflow:auto}.event{position:relative;margin-left:12px;padding:11px 12px 11px 17px;border-left:3px solid #259a73;border-radius:0 9px 9px 0;background:#edf9f4}.event.message{border-left-color:#78bfa7;background:#fff}.event strong,.event small{display:block}.event small{margin-top:4px;color:var(--muted)}.chat-log{display:flex;flex-direction:column;gap:9px;max-height:260px;overflow:auto;padding:5px}.bubble{position:relative;align-self:flex-start;max-width:82%;padding:10px 12px;border-radius:13px 13px 13px 3px;background:#dff2ea;white-space:pre-wrap}.delete-message{position:absolute;top:5px;right:7px;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;line-height:20px}.delete-message:hover{background:#cce9dd;color:#0d4938}.bubble{padding-right:34px}.bubble small{display:block;margin-top:4px;color:var(--muted)}.chat-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.chat-form input{padding:11px;border:1px solid var(--line);border-radius:10px}.case-main{display:grid;gap:12px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px;border-top:1px solid var(--line)}.pager button{padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--brand);font-weight:800}.pager button:disabled{opacity:.4}.summary small{display:none}.records,.update-panel{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.records h3,.update-panel h3{margin:0 0 12px}.record-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.record-tabs button{padding:9px 14px;border:1px solid #9fcdbd;border-radius:8px 8px 0 0;background:#e7f4ef;color:var(--ink);font-weight:850}.record-tabs button.active{background:#07351f;color:#35f08c;border-color:#07351f}.record-screen{min-height:220px;max-height:420px;overflow:auto;padding:16px;border-radius:9px;background:#03180d;color:#39f58f;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.record-page-label{margin:8px 0 0;color:var(--muted);font-size:11px}.update-panel .edit{margin-top:0}.update-panel .edit>label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:850}.update-panel .edit>button{align-self:end}@media(max-width:800px){body{padding-left:0}.sidebar{position:sticky;width:100%;height:auto;padding:12px 12px 7px;flex-direction:row;align-items:center}.brand{font-size:18px}.kicker,.side-bottom{display:none}.nav{display:flex;margin-left:auto;overflow-x:auto}.nav button{width:auto;min-width:max-content;padding:9px}.nav button span:not(.count){display:none}.workspace{padding:12px}.card{min-height:calc(100vh - 80px);padding:14px}.topbar{align-items:flex-start;flex-wrap:wrap}.search{order:2;margin-left:0;width:100%}.summary{grid-template-columns:repeat(2,1fr)}.summary button{grid-template-columns:1fr;gap:5px;padding:10px}.summary .icon{display:none}.summary strong{font-size:22px}.head{grid-template-columns:70px 1fr}.head>div:nth-child(n+3){display:none}.grid,.edit,.hotel-fields,.case-layout{grid-template-columns:1fr}.wide,.hotel-address{grid-column:auto}}
</style></head>
<body>
<aside class="sidebar"><a class="brand" href="index.html">MUIRR</a><div class="kicker">Passenger Operations</div><nav class="nav" aria-label="Case status"><button class="active" data-view="Waiting"><span>Waiting</span><b class="count">0</b></button><button data-view="In Progress"><span>In Progress</span><b class="count">0</b></button><button data-view="Hotel"><span>Hotel</span><b class="count">0</b></button><button data-view="Case Closed"><span>Case Closed</span><b class="count">0</b></button></nav><div class="side-bottom"><button class="side-action" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6 9a7 7 0 0 1 12-3l2 5M4 13l2 5a7 7 0 0 0 12-3"/></svg>Refresh</button><button class="side-action" id="logout"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 9l4 3-4 3M18 12H9"/></svg>Logout</button></div></aside>
<main class="workspace"><section class="card"><div class="topbar"><h1 id="title">Waiting</h1><input class="search" id="search" placeholder="Search BN, name, destination, ticket…"></div><div class="summary"><button class="active" data-view="Waiting"><span><b>Waiting</b></span><strong data-count="Waiting">0</strong></button><button data-view="In Progress"><span><b>In Progress</b></span><strong data-count="In Progress">0</strong></button><button data-view="Hotel"><span><b>Hotel</b></span><strong data-count="Hotel">0</strong></button><button data-view="Case Closed"><span><b>Case Closed</b></span><strong data-count="Case Closed">0</strong></button></div><section class="panel"><div class="panel-title" id="panel-title">Waiting <span>(0)</span></div><div class="cases" id="cases"><div class="empty">Loading cases…</div></div><div class="pager" id="pager"></div></section></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js" onerror="this.remove()"></script><script>
const apiBase=(window.MU_API_BASE||'https://api.mufcapp.net').replace(/\/$/,''),casesEl=document.querySelector('#cases'),search=document.querySelector('#search'),pager=document.querySelector('#pager');let rows=[],expanded=new Set(),loading=false,currentView='Waiting',page=1,recordPages=new Map();const PAGE_SIZE=8;
const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));function loginUrl(){const url=new URL('login.html',location.href);url.searchParams.set('next',location.pathname+location.search);return url.href}const auth=window.firebase?.apps?.length&&window.firebase?.auth?firebase.auth():null;if(auth)auth.onAuthStateChanged(user=>{if(!user)location.replace(loginUrl())});
const statuses=['Waiting','In Progress','Hotel','Case Closed'];const normalizedStatus=row=>['Closed','Completed'].includes(row.status)?'Case Closed':statuses.includes(row.status)?row.status:'Waiting';const fmt=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?String(value||''):date.toLocaleString()};
function selectView(view){currentView=view;page=1;document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));document.querySelector('#title').textContent=view;render()}
function historyHtml(row){const history=Array.isArray(row.caseHistory)?row.caseHistory:[];const events=history.slice().reverse();return events.length?events.map(item=>`<div class="event ${item.type==='message'?'message':''}"><strong>${esc(item.type==='message'?'Message':item.status||'Update')}</strong>${item.message?`<span>${esc(item.message)}</span>`:''}<small>${esc(fmt(item.at))} · ${esc(item.by||'Agent')}</small></div>`).join(''):'<p class="empty">No progress recorded.</p>'}
function chatHtml(row){const messages=(Array.isArray(row.caseHistory)?row.caseHistory:[]).map((item,index)=>({...item,historyIndex:index})).filter(item=>item.type==='message');return messages.length?messages.map(item=>`<div class="bubble"><button type="button" class="delete-message" data-delete-message="${item.historyIndex}" aria-label="Delete message">−</button>${esc(item.message)}<small>${esc(item.by||'Agent')} · ${esc(fmt(item.at))}</small></div>`).join(''):'<p class="empty">No messages yet. Start the case conversation below.</p>'}
function recordsHtml(row){const companions=String(row.companionPnrRecords||'').split(/\n\n(?=BN\s)/).filter(Boolean),records=[{label:'Record - PNR',text:row.pnrRecord||'No PNR record'},{label:'Record - TKT',text:row.newTicketNumber||'No updated ticket record'},...companions.map((text,index)=>({label:`Companion ${index+1}`,text}))];const selected=Math.min(recordPages.get(row.rowNumber)||0,records.length-1),item=records[selected];return `<section class="records"><h3>Records</h3><div class="record-tabs">${records.map((record,index)=>`<button type="button" class="${index===selected?'active':''}" data-record-page="${index}">${esc(record.label)}</button>`).join('')}</div><pre class="record-screen">${esc(item.text)}</pre><p class="record-page-label">Record ${selected+1} of ${records.length}</p></section>`}

function render(){for(const view of statuses){const count=rows.filter(row=>normalizedStatus(row)===view).length;document.querySelectorAll(`[data-count="${view}"],.nav [data-view="${view}"] .count`).forEach(el=>el.textContent=count)}const q=search.value.trim().toLowerCase(),all=rows.filter(row=>normalizedStatus(row)===currentView&&Object.values(row).join(' ').toLowerCase().includes(q)).slice().reverse(),pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));page=Math.min(page,pages);const visible=all.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);document.querySelector('#panel-title').innerHTML=`${esc(currentView)} <span>(${all.length})</span>`;pager.innerHTML=`<button data-page="${page-1}" ${page===1?'disabled':''}>Previous</button><b>Page ${page} / ${pages}</b><button data-page="${page+1}" ${page===pages?'disabled':''}>Next</button>`;if(!visible.length){casesEl.innerHTML='<div class="empty">No matching cases.</div>';return}casesEl.innerHTML=visible.map(row=>{const open=expanded.has(row.rowNumber);return `<article class="case ${open?'open':''}" data-row="${row.rowNumber}"><div class="head" data-toggle><div><span class="label">BN</span><span class="bn">${esc(row.bn)}</span></div><div><span class="label">Passenger</span><strong>${esc(row.passengerName)||'—'}</strong></div><div><span class="label">Status</span><span class="pill">${esc(normalizedStatus(row))}</span></div><div><span class="label">Destination</span>${esc(row.finalDestination)||'—'}</div><div><span class="label">Submitted</span>${esc(fmt(row.submittedAt))}</div></div><div class="detail"><div class="case-layout"><aside class="progress-card"><h3>Case Progress</h3><div class="timeline">${historyHtml(row)}</div></aside><div class="case-main"><div class="grid"><div class="box"><span class="label">Contact</span>${esc(row.phone)}<br>${esc(row.email)}</div><div class="box"><span class="label">Travel party / Companion BN</span>${esc(row.travelParty)} · ${esc(row.companionBns)||'—'}</div><div class="box wide"><span class="label">Passenger intention</span>${esc(row.intention)}</div></div><section class="update-panel"><h3>Update</h3><form class="edit ${normalizedStatus(row)==='Hotel'?'hotel-selected':''}"><label><span>Status</span><select name="status">${statuses.map(status=>`<option ${status===normalizedStatus(row)?'selected':''}>${status}</option>`).join('')}</select></label><label><span>Update New TKT</span><input name="newTicketNumber" value="${esc(row.newTicketNumber)}" placeholder="New ticket number"></label><label><span>Comment</span><textarea name="comment" placeholder="Comment / 留言">${esc(row.comment)}</textarea></label><button class="update">Update</button><div class="hotel-fields"><label><span>Hotel name *</span><input name="hotelName" value="${esc(row.hotelName)}"></label><label class="hotel-address"><span>Hotel address</span><input name="hotelAddress" value="${esc(row.hotelAddress)}"></label><label><span>Confirmation number</span><input name="hotelConfirmation" value="${esc(row.hotelConfirmation)}"></label><label><span>Check-in</span><input name="hotelCheckIn" type="datetime-local" value="${esc(row.hotelCheckIn)}"></label><label><span>Check-out</span><input name="hotelCheckOut" type="datetime-local" value="${esc(row.hotelCheckOut)}"></label></div></form></section><section class="conversation"><h3>Case Conversation</h3><div class="chat-log">${chatHtml(row)}</div><form class="chat-form"><input name="chatMessage" maxlength="1000" placeholder="Write a message…" required><button class="update">Send</button></form></section>${recordsHtml(row)}</div></div><small class="updated">Last update: ${esc(fmt(row.updatedAt)||'—')} ${row.updatedBy?'by '+esc(row.updatedBy):''}</small></div></article>`}).join('')}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>selectView(button.dataset.view));pager.onclick=event=>{const button=event.target.closest('[data-page]');if(!button||button.disabled)return;page=Number(button.dataset.page);render()};casesEl.onclick=async event=>{const deleteButton=event.target.closest('[data-delete-message]');if(deleteButton){if(!confirm('Delete this message?'))return;const article=deleteButton.closest('.case'),rowNumber=Number(article.dataset.row);deleteButton.disabled=true;try{const response=await fetch(`${apiBase}/irr-cases/${rowNumber}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deleteMessageIndex:Number(deleteButton.dataset.deleteMessage),updatedBy:auth?.currentUser?.email||'Agent'})}),result=await response.json();if(!response.ok)throw new Error(result.error);rows=rows.map(row=>row.rowNumber===rowNumber?result.record:row);selectView(normalizedStatus(result.record))}catch(error){alert(error.message)}return}const recordButton=event.target.closest('[data-record-page]');if(recordButton){const article=recordButton.closest('.case');recordPages.set(Number(article.dataset.row),Number(recordButton.dataset.recordPage));render();return}const toggle=event.target.closest('[data-toggle]');if(!toggle)return;const number=Number(toggle.closest('.case').dataset.row);expanded.has(number)?expanded.delete(number):expanded.add(number);render()};casesEl.onchange=event=>{if(event.target.name!=='status')return;event.target.closest('.edit').classList.toggle('hotel-selected',event.target.value==='Hotel')};casesEl.onsubmit=async event=>{event.preventDefault();const form=event.target,rowNumber=Number(form.closest('.case').dataset.row),button=form.querySelector('button'),body=Object.fromEntries(new FormData(form)),isChat=form.classList.contains('chat-form');if(!isChat&&body.status==='Hotel'&&!body.hotelName.trim()){alert('Please enter the hotel provided to the passenger.');return}body.updatedBy=auth?.currentUser?.email||'Agent';button.disabled=true;button.textContent=isChat?'Sending…':'Saving…';try{const response=await fetch(`${apiBase}/irr-cases/${rowNumber}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw new Error(result.error);rows=rows.map(row=>row.rowNumber===rowNumber?result.record:row);selectView(normalizedStatus(result.record))}catch(error){alert(error.message)}finally{if(button.isConnected){button.disabled=false;button.textContent=isChat?'Send':'Update'}}};
async function load(){if(loading)return;loading=true;try{const response=await fetch(`${apiBase}/irr-cases`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error);rows=data.rows||[];render()}catch(error){casesEl.innerHTML=`<div class="empty">${esc(error.message)}</div>`}finally{loading=false}}search.oninput=()=>{page=1;render()};document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=()=>auth?auth.signOut().then(()=>location.replace(loginUrl())):location.replace(loginUrl());load();setInterval(load,30000);
</script></body></html>
