<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passenger Contact Form | 旅客联系表</title>
  <style>
    :root { color-scheme:light; --navy:#092d57; --blue:#1768b5; --red:#dc2538; --ink:#142033; --muted:#637083; --line:#dbe4ee; --bg:#eef5fb; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; background:radial-gradient(circle at 15% 0,#d9ebfb 0,transparent 33%),linear-gradient(145deg,#f6f9fc,#eaf2f9); }
    .topbar { height:7px; background:linear-gradient(90deg,var(--navy) 0 67%,var(--red) 67%); }
    header { display:flex; align-items:center; gap:14px; width:min(760px,calc(100% - 32px)); margin:28px auto 18px; }
    .mark { display:grid; place-items:center; width:50px; height:50px; border-radius:16px; color:#fff; font-size:19px; font-weight:900; letter-spacing:.06em; background:var(--navy); box-shadow:0 12px 24px #092d5730; }
    header strong { display:block; color:var(--navy); font-size:17px; } header span { color:var(--muted); font-size:13px; }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto 56px; }
    .card { overflow:hidden; border:1px solid #fff; border-radius:26px; background:rgba(255,255,255,.96); box-shadow:0 24px 65px #173b5d1c; }
    .intro { padding:32px clamp(22px,5vw,44px) 24px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 9px; color:var(--navy); font-size:clamp(27px,5vw,39px); line-height:1.15; } .intro p { margin:0; color:var(--muted); line-height:1.65; }
    form { display:grid; gap:21px; padding:28px clamp(22px,5vw,44px) 38px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    label { display:grid; gap:8px; font-size:14px; font-weight:750; }
    label span small { display:block; margin-top:2px; color:var(--muted); font-size:12px; font-weight:500; }
    .required { color:var(--red); }
    input { width:100%; min-height:48px; padding:12px 14px; color:var(--ink); font:inherit; border:1px solid var(--line); border-radius:12px; outline:none; background:#fbfdff; transition:.2s; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 4px #1768b519; background:#fff; }
    .upload { padding:18px; border:1px dashed #9fb6ce; border-radius:16px; background:#f7fbff; }
    .upload input { margin-top:11px; min-height:auto; padding:10px; background:#fff; }
    .hint { margin:8px 0 0; color:var(--muted); font-size:12px; font-weight:500; line-height:1.5; }
    .actions { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    button { min-width:150px; padding:14px 22px; color:#fff; font:800 15px inherit; border:0; border-radius:999px; cursor:pointer; background:linear-gradient(135deg,var(--navy),var(--blue)); box-shadow:0 12px 25px #1768b52b; }
    button:disabled { cursor:wait; opacity:.65; } #status { color:var(--muted); font-size:13px; font-weight:650; } #status.error { color:#b42318; }
    dialog { width:min(500px,calc(100% - 32px)); padding:0; border:0; border-radius:24px; box-shadow:0 30px 80px #071b3155; } dialog::backdrop { background:#071b3180; backdrop-filter:blur(4px); }
    .modal { padding:32px; text-align:center; } .check { display:grid; place-items:center; width:62px; height:62px; margin:0 auto 18px; border-radius:50%; color:#fff; font-size:30px; background:#16835b; } .modal h2 { margin:0 0 12px; color:var(--navy); } .modal p { color:var(--muted); line-height:1.7; } .modal button { margin-top:8px; }
    @media (max-width:600px) { .grid { grid-template-columns:1fr; } header { margin-top:20px; } .intro { padding-top:26px; } }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <header><div class="mark">MU</div><div><strong>China Eastern Airlines</strong><span>Passenger Services · 旅客服务</span></div></header>
  <main>
    <section class="card">
      <div class="intro"><h1>旅客联系表</h1><p>Passenger Contact Form<br>请填写以下必填信息。Please complete all required fields below.</p></div>
      <form id="contact-form">
        <div class="grid">
          <label><span>日期 <span class="required">*</span><small>Date</small></span><input id="date" name="date" type="date" required></label>
          <label><span>姓名 <span class="required">*</span><small>Name</small></span><input name="name" autocomplete="name" maxlength="160" required></label>
          <label><span>座位号 <span class="required">*</span><small>Seat number</small></span><input name="seatNumber" maxlength="20" placeholder="例如 / e.g. 32A" required></label>
          <label><span>票号 <span class="required">*</span><small>Ticket number</small></span><input name="ticketNumber" inputmode="numeric" maxlength="40" required></label>
          <label><span>电话号码 <span class="required">*</span><small>Phone number</small></span><input name="phone" type="tel" autocomplete="tel" maxlength="80" required></label>
        </div>
        <label class="upload"><span>上传附件<small>Attachments (例如 / e.g. boarding pass)</small></span><input id="attachments" type="file" accept="image/*,.pdf" multiple><p class="hint">可选，最多 10 个文件，每个不超过 8 MB，总计不超过 22 MB。Optional: up to 10 files, 8 MB each and 22 MB total.</p></label>
        <div class="actions"><button id="submit" type="submit">提交 / Submit</button><span id="status" role="status" aria-live="polite"></span></div>
      </form>
    </section>
  </main>
  <dialog id="success-dialog"><div class="modal"><div class="check">✓</div><h2>提交成功 · Submitted</h2><p>请耐心等待工作人员与您取得联系。<br>Please wait patiently for a staff member to contact you.</p><button id="close-dialog" type="button">好的 / OK</button></div></dialog>
  <script>
    const apiBase = (window.MU_API_BASE || 'https://api.mufcapp.net').replace(/\/$/, '');
    const form = document.querySelector('#contact-form');
    const dateInput = document.querySelector('#date');
    const fileInput = document.querySelector('#attachments');
    const submitButton = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const dialog = document.querySelector('#success-dialog');
    function localToday() { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; }
    dateInput.value = localToday();
    function fileToAttachment(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve({ filename:file.name, mimeType:file.type || 'application/octet-stream', contentBase64:String(reader.result || '').split(',')[1] || '' }); reader.onerror = reject; reader.readAsDataURL(file); }); }
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); status.className = ''; status.textContent = '正在提交… Submitting…'; submitButton.disabled = true;
      try {
        const files = Array.from(fileInput.files || []);
        if (files.length > 10 || files.some((file) => file.size > 8 * 1024 * 1024) || files.reduce((sum, file) => sum + file.size, 0) > 22 * 1024 * 1024) throw new Error('附件最多 10 个，每个不超过 8 MB，总计不超过 22 MB。Up to 10 files, 8 MB each and 22 MB total.');
        const fields = Object.fromEntries(new FormData(form).entries()); delete fields.attachments;
        fields.attachments = await Promise.all(files.map(fileToAttachment));
        const response = await fetch(`${apiBase}/contact-form-submissions`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(fields) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || '提交失败，请稍后重试。Submission failed; please try again.');
        form.reset(); dateInput.value = localToday(); status.textContent = ''; dialog.showModal();
      } catch (error) { status.className = 'error'; status.textContent = error.message; }
      finally { submitButton.disabled = false; }
    });
    document.querySelector('#close-dialog').addEventListener('click', () => dialog.close());
  </script>
</body>
</html>
