<!doctype html>
<html lang="en">
  <head>
  <link rel="apple-touch-icon" sizes="180x180" href="/has/assets/mufc-app-icon-v1-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/has/assets/mufc-app-icon-v1-192.png">
  <link rel="manifest" href="/has/push-manifest.webmanifest?v=20261031-mufc-icon">
    <script src="/flight-session.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MUFC Login</title>
    <style>
      :root {
        --bg: #020a12;
        --panel: rgba(6, 20, 34, 0.72);
        --line: rgba(176, 216, 255, 0.24);
        --text: #f3f7fb;
        --muted: #98a8b8;
        --blue: #58a7ff;
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #01050b;
        isolation: isolate;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: url("assets/flights-griffith-stone-terrace.webp");
        background-position: center;
        background-repeat: no-repeat;
        background-size: max(100vw, 177.78vh) auto;
        filter: saturate(1.08) contrast(1.08);
        transform: translate3d(0, 0, 0) scale(1.018);
        transform-origin: 64% 62%;
        animation: orbitalDrift 72s ease-in-out infinite alternate;
        backface-visibility: hidden;
        will-change: transform;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 72% 58%, rgba(66, 151, 255, 0.2), transparent 24rem),
          radial-gradient(circle at 50% 110%, rgba(15, 75, 122, 0.28), transparent 34rem),
          linear-gradient(180deg, rgba(0, 0, 0, 0.28), transparent 22rem),
          linear-gradient(90deg, rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.18) 48%, rgba(0, 0, 0, 0.42) 100%),
          linear-gradient(115deg, rgba(3, 10, 18, 0.18), rgba(1, 5, 10, 0.5));
        z-index: -1;
      }

      @keyframes orbitalDrift {
        from {
          transform: translate3d(-0.35vw, -0.15vh, 0) scale(1.018) rotate(-0.05deg);
        }
        to {
          transform: translate3d(0.35vw, 0.25vh, 0) scale(1.032) rotate(0.18deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before {
          animation: none;
          transform: translate3d(0, 0, 0) scale(1.018);
        }
      }

      .login-card {
        position: relative;
        z-index: 1;
        width: min(360px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid var(--line);
        background: linear-gradient(150deg, rgba(9, 28, 48, 0.78), rgba(2, 12, 22, 0.66));
        box-shadow: 0 30px 110px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(18px);
        animation: fadeUp 560ms ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }

      .brand svg {
        width: 25px;
        height: 25px;
        color: #8bbcff;
      }

      .brand strong {
        font-size: 30px;
        line-height: 1;
        letter-spacing: 4px;
      }

      .subhead {
        margin: 8px 0 22px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.8px;
      }

      .field {
        display: block;
        margin-bottom: 12px;
      }

      .field input {
        width: 100%;
        height: 42px;
        border: 1px solid rgba(210, 231, 255, 0.2);
        border-radius: 0;
        padding: 0 13px;
        outline: 0;
        background: rgba(227, 237, 251, 0.96);
        color: #071327;
        font: inherit;
        font-size: 12px;
      }

      .field input:focus {
        border-color: rgba(88, 167, 255, 0.9);
        box-shadow: 0 0 0 3px rgba(88, 167, 255, 0.18);
      }

      .password-field {
        position: relative;
      }

      .password-field input {
        padding-right: 48px;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 9px;
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        transform: translateY(-50%);
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #3b4c72;
        cursor: pointer;
      }

      .password-toggle:hover,
      .password-toggle:focus-visible {
        background: rgba(88, 167, 255, 0.16);
        color: #142047;
        outline: 0;
      }

      .password-toggle svg {
        width: 20px;
        height: 20px;
      }

      .password-toggle .eye-off {
        display: none;
      }

      .password-toggle[aria-pressed="true"] .eye-on {
        display: none;
      }

      .password-toggle[aria-pressed="true"] .eye-off {
        display: block;
      }

      .login-button {
        width: 100%;
        height: 44px;
        margin-top: 4px;
        border: 1px solid rgba(88, 167, 255, 0.72);
        border-radius: 0;
        background: linear-gradient(180deg, #3376ff, #245fe6);
        color: white;
        font: inherit;
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
      }

      .login-button:hover:not(:disabled) {
        background: linear-gradient(180deg, #4382ff, #2d67ee);
      }

      .login-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .login-status {
        min-height: 18px;
        margin: 12px 0 0;
        color: #ffb4ae;
        font-size: 12px;
        line-height: 1.5;
      }

      .login-status.is-info {
        color: var(--muted);
      }
    </style>
    <link rel="stylesheet" href="assets/login-orbit.css?v=20261026-counter-hd" />
    <link rel="stylesheet" href="/auth-confirm.css?v=20261023-employee-setup" />
  <link rel="stylesheet" href="/assets/airport-scene.css?v=20261026-mobile-wide" /><link rel="stylesheet" href="/assets/griffith-scene.css?v=20261027-griffith" /></head>
  <body class="airport-scene login-orbit">
    <main class="login-card" aria-label="Login">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 13.5h18M10 4l4 9-4 7M5.5 8.5l2.5 5-2.5 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <strong>MUFC</strong>
      </div>
      <p class="subhead">Internal Access Only</p>
      <form id="login-form" method="post" autocomplete="on" novalidate>
        <label class="field">
          <input id="email" name="email" type="email" autocomplete="username" aria-label="Email" placeholder="Email" required />
        </label>
        <label class="field password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required />
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.9"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M10.6 6.2c.45-.12.92-.2 1.4-.2 6.1 0 9.5 6 9.5 6a17.3 17.3 0 0 1-3 3.65M6.2 7.8A17.4 17.4 0 0 0 2.5 12s3.4 6 9.5 6c1.55 0 2.9-.39 4.05-.97" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
        </label>
        <button class="login-button" type="submit">Login</button>
        <button class="login-button" id="google-login" type="button" style="margin-top:12px;background:#fff;color:#172b46" disabled>Continue with Google</button>
        <p class="login-status is-info" role="status" aria-live="polite">Connecting to Firebase...</p>
      </form>
      <div class="login-signature" aria-hidden="true"><b>MUFC</b><span>OPERATION<br>SAFETY<br>EFFICIENCY<br>TEAMWORK</span></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/employee-profile-api.js?v=20261026-avatar-crop"></script>
    <script>
      const form = document.querySelector("#login-form");
      const emailInput = document.querySelector("#email");
      const passwordInput = document.querySelector("#password");
      const submitButton = document.querySelector(".login-button");
      const passwordToggle = document.querySelector(".password-toggle");
      const statusText = document.querySelector(".login-status");

      function setStatus(message, isError = false) {
        statusText.textContent = message;
        statusText.classList.toggle("is-info", !isError);
      }

      passwordToggle.addEventListener("click", () => {
        const shouldShow = passwordInput.type === "password";
        passwordInput.type = shouldShow ? "text" : "password";
        passwordToggle.setAttribute("aria-pressed", String(shouldShow));
        passwordToggle.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
        passwordInput.focus();
      });

      const APP_ENTRY_KEY = "mufc_allow_app_entry";
      const AUTH_SESSION_STARTED_KEY = "mufc_auth_session_started_at";
      const AUTH_LAST_ACTIVITY_KEY = "mufc_auth_last_activity_at";

      function storageCandidates() {
        return ["localStorage", "sessionStorage"].map((key) => {
          try {
            return window[key];
          } catch (error) {
            return null;
          }
        }).filter(Boolean);
      }

      function safeSetStorage(key, value) {
        for (const storage of storageCandidates()) {
          try {
            storage.setItem(key, value);
            return true;
          } catch (error) {
            // Some mobile/private browsers expose storage but reject writes.
          }
        }
        return false;
      }

      function allowAppEntry() {
        const now = String(Date.now());
        safeSetStorage(APP_ENTRY_KEY, now);
        safeSetStorage(AUTH_SESSION_STARTED_KEY, now);
        safeSetStorage(AUTH_LAST_ACTIVITY_KEY, now);
      }

      function getRedirectTarget() {
        const next = new URLSearchParams(location.search).get('next');
        if(next && /^\/(read-sign|uniform|attendance)\.html(?:[?#]|$)/.test(next)) return new URL(next, location.origin).href;
        return new URL("flights.html", window.location.href).href;
      }

      function friendlyAuthError(error) {
        switch (error?.code) {
          case "auth/invalid-email":
            return "Email format is invalid.";
          case "auth/invalid-credential":
          case "auth/user-not-found":
          case "auth/wrong-password":
            return "Email or password is incorrect.";
          case "auth/too-many-requests":
            return "Too many attempts. Please wait and try again.";
          case "auth/network-request-failed":
            return "Cannot reach Firebase. Please check the network and try again.";
          default:
            return error?.message || "Firebase login failed. Please try again.";
        }
      }

      function enableForm() {
        submitButton.disabled = false;
        document.querySelector('#google-login').disabled = false;
        setStatus("Ready to sign in.");
      }

      if (!window.firebase?.apps?.length || !window.firebase?.auth) {
        submitButton.disabled = true;
        setStatus("Firebase is not connected. Open this page from Firebase Hosting and redeploy if this continues.", true);
      } else {
        const auth = firebase.auth();
        const persistenceReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
          .catch(() => auth.setPersistence(firebase.auth.Auth.Persistence.SESSION))
          .catch(() => {});
        const dialog=document.createElement('dialog');
        dialog.className='auth-confirm';dialog.setAttribute('aria-labelledby','confirm-title');dialog.setAttribute('aria-describedby','link-help');
        dialog.innerHTML='<form id="link-form"><header class="confirm-heading"><div class="confirm-brand">MUFC<span>GOOGLE SIGN-IN</span></div><span class="confirm-step">01 / ACCOUNT</span></header><div class="confirm-body"><div class="confirm-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8 4h8v3H8zM7 5H5v16h14V5h-2M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="confirm-eyebrow">YOUR EMPLOYEE RECORD</p><h2 id="confirm-title">Confirm your details</h2><p class="confirm-subtitle">确认员工资料</p><p id="link-help"></p><label id="main-account-label" hidden>MAIN ACCOUNT / 所属主账户<select id="link-main-account"></select></label><dl id="link-details"></dl><p id="link-status" role="status" aria-live="polite"></p><div class="confirm-actions"><button id="link-submit" type="submit">Find employee</button><button id="link-cancel" type="button">Sign out<span>退出登录</span></button></div><p class="confirm-footnote">MUFC · Employee access</p></div></form>';
        document.body.append(dialog);let pending,busy=false;
        function showLink(data){
          pending=data;
          const select=dialog.querySelector('#link-main-account');
          dialog.querySelector('#main-account-label').hidden=false;select.required=true;select.replaceChildren(new Option('Select Account / 选择账户',''));
          const accounts=data.accounts||(data.profile?[{station:data.profile.station,account:data.profile.account}]:[]);
          for(const scope of accounts)select.add(new Option(scope.station+' / '+scope.account,JSON.stringify(scope)));
          dialog.querySelector('#confirm-title').textContent='Choose your account';dialog.querySelector('.confirm-subtitle').textContent='选择所属账户';
          dialog.querySelector('#link-help').textContent='Select your Main Account to continue. / 选择所属主账户后继续。';
          dialog.querySelector('#link-details').replaceChildren();dialog.querySelector('#link-submit').textContent='Continue / 继续';
          if(!dialog.open)dialog.showModal();
        }
        async function finishLogin(user){
          if(busy||!user)return;busy=true;
          try{
            if(!/^[^@\s]+@mu\.com$/i.test(user.email||'')){
              const data=await employeeProfileApi();if(data.state!=='ready'){showLink(data);return;}
            }
            allowAppEntry();window.location.replace(getRedirectTarget());
          }catch(error){setStatus(error.message,true);await auth.signOut();}
          finally{busy=false;}
        }
        let signingPassword=false;
        auth.onAuthStateChanged(user=>{if(user&&!signingPassword)finishLogin(user);else if(!user)enableForm();});
        async function cancelLink(){dialog.close();pending=null;await auth.signOut();setStatus('Sign-in cancelled.');}
        dialog.querySelector('#link-cancel').onclick=cancelLink;
        dialog.oncancel=event=>{event.preventDefault();cancelLink();};
        dialog.querySelector('form').onsubmit=async event=>{
          event.preventDefault();const button=dialog.querySelector('#link-submit'),status=dialog.querySelector('#link-status');button.disabled=true;status.textContent='Checking…';
          try{
            await employeeProfileApi('/select-account',{revision:pending.revision,...JSON.parse(dialog.querySelector('#link-main-account').value)});dialog.close();await finishLogin(auth.currentUser);
          }catch(error){status.textContent=error.message;if(error.status===409){try{showLink(await employeeProfileApi());}catch{}}}
          finally{button.disabled=false;}
        };
        let pendingGoogleCredential;
        document.querySelector('#google-login').onclick=async()=>{
          const button=document.querySelector('#google-login');button.disabled=true;setStatus('Opening Google sign-in…');
          try{await persistenceReady;const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await auth.signInWithPopup(provider);}
          catch(error){
            if(error.code==='auth/account-exists-with-different-credential'){pendingGoogleCredential=error.credential;emailInput.value=error.email||'';setStatus('Sign in with your existing password to link this Google account.',true);}
            else setStatus(error.code==='auth/operation-not-allowed'?'Google sign-in needs to be enabled by the administrator.':friendlyAuthError(error),true);
          }finally{button.disabled=false;}
        };

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          submitButton.disabled = true;
          setStatus("Signing in...");
          signingPassword=true;
          try {
            await persistenceReady;
            const credential = await auth.signInWithEmailAndPassword(emailInput.value.trim(), passwordInput.value);
            if(pendingGoogleCredential&&credential?.user){const googleCredential=pendingGoogleCredential;await credential.user.linkWithCredential(googleCredential);const linked=await auth.signInWithCredential(googleCredential);pendingGoogleCredential=null;await finishLogin(linked.user);return;}
            if (credential?.user) {
              await finishLogin(credential.user);
            }
          } catch (error) {
            submitButton.disabled = false;
            setStatus(friendlyAuthError(error), true);
          } finally {signingPassword=false;}
        });
      }
    </script>
  </body>
</html>
