<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142739"><title>旅客心声</title><link rel="stylesheet" href="/feedback.css"><script defer src="/feedback-client.js"></script></head>
<body><main class="shell" data-page="home"><header><button id="back" class="back" aria-label="返回" hidden>‹</button><span data-text="brand">旅客心声</span><div class="language" role="group" aria-label="Language"><button id="zh" aria-pressed="true">中文</button><button id="en" aria-pressed="false">EN</button></div></header>
<section id="home"><div class="intro"><h1 data-text="headline">每一份心声，<br>都值得被倾听。</h1><p data-text="tagline">感谢您，让我们的服务更进一步。</p></div><div class="scene"><img class="host" src="/assets/feedback/welcome.png" alt=""></div><div class="choices"><button class="praise" data-type="praise"><span>☆</span><span data-text="praise">表扬</span><span>→</span></button><button class="complaint" data-type="complaint"><span>▤</span><span data-text="complaint">投诉</span><span>→</span></button></div></section>
<form id="passenger" hidden><p class="eyebrow" id="type-label"></p><h1 data-text="passenger">旅客信息</h1><p class="muted" data-text="trip">请填写本次旅程的信息。</p><label><span data-text="name">旅客姓名</span> <b>*</b><input id="name" autocomplete="name" maxlength="100" required></label><label><span data-text="date">乘机日期</span> <b>*</b><input id="date" type="date" required></label><label><span data-text="seat">座位号</span> <b>*</b><input id="seat" maxlength="4" pattern="[0-9]{1,3}[A-Za-z]" placeholder="39C" required autocapitalize="characters"></label><button class="primary" data-text="next">下一步 →</button></form>
<form id="experience" hidden><p class="eyebrow" data-text="share">分享您的体验</p><h1 data-text="listen">您的体验，<br>我们认真倾听。</h1><label><span data-text="feedback">体验反馈</span> <b>*</b><small data-text="minimum">请详细描述您的体验（至少20个字符）</small><textarea id="details" rows="6" maxlength="10000" required></textarea></label><label><span id="staff-label">表扬对象</span> <b>*</b><select id="staff" required></select><small data-text="nickname">请选择员工昵称</small></label><button type="button" id="reload-staff" class="text-link" data-text="reload">重新加载名单</button><div class="trap" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off" aria-label="Website"></div><button id="submit" class="primary" data-text="submit">提交反馈 →</button><p class="foot" data-text="privacy">您的反馈将发送至服务管理团队。</p></form>
<section id="success" hidden><div id="confetti" aria-hidden="true"></div><div class="success-art"><img src="/assets/feedback/thanks.png" alt=""><span class="check" aria-hidden="true">✓</span></div><h1 data-text="thanks">感谢您的分享。</h1><h2 data-text="submitted">反馈已成功提交</h2><p data-text="received">您的反馈已发送至服务管理团队，帮助我们将每一程服务做得更好。</p><dl><div><dt data-text="type">反馈类型</dt><dd id="sent-type"></dd></div><div><dt data-text="time">提交时间</dt><dd id="sent-time"></dd></div></dl><button id="home-button" class="primary" data-text="home">返回首页</button></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
