<!doctype html>
<html lang="en">
<head>
    <script src="/flight-session.js?v=20261016-box"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boarding</title><link rel="stylesheet" href="/flight-navigation.css?v=20261009-vertical-switch">
  <link rel="stylesheet" href="/nbrd-review.css?v=20261014-honeycomb-six"><script src="/nbrd-review.js?v=20261014-numeric-sort"></script>
  <style>
    :root { --brand:#123a73; --line:#d7e1ec; --ink:#172033; --muted:#667085; --ok:#087443; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Arial,"Noto Sans SC",sans-serif; background:linear-gradient(135deg,#eaf4ff,#fdfefe); color:var(--ink); }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px clamp(18px,4vw,52px); background:rgba(255,255,255,.92); border-bottom:1px solid var(--line); }
    .brand { font-weight:900; color:var(--brand); letter-spacing:.08em; text-decoration:none; }
    .header-actions { position:relative; display:flex; align-items:center; gap:10px; }
    .avatar-button { display:grid; width:44px; height:44px; place-items:center; border-radius:999px; padding:0; background:#050914; color:white; }
    .avatar-button svg { width:26px; height:26px; }
    .user-menu { position:absolute; top:calc(100% + 10px); right:0; z-index:20; display:grid; min-width:190px; gap:6px; padding:10px; border:1px solid var(--line); border-radius:18px; background:white; box-shadow:0 18px 42px rgba(22,48,76,.18); }
    .user-menu[hidden] { display:none; }
    .user-menu button { width:100%; border-radius:12px; background:#eef4fb; color:var(--brand); text-align:left; }
    .user-menu button:last-child { background:#fff1f1; color:var(--danger); }
    main { width:min(860px,94vw); margin:28px auto; display:grid; gap:18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 42px rgba(22,48,76,.08); padding:22px; }
    .camera-wrap { position:relative; width:100%; aspect-ratio:16 / 9; overflow:hidden; border-radius:18px; background:#111; }
    video { display:block; width:100%; height:100%; background:#111; object-fit:cover; }
    .aim-box { position:absolute; left:50%; top:50%; width:min(78%,560px); height:34%; transform:translate(-50%,-50%); border:3px solid rgba(255,255,255,.92); border-radius:18px; box-shadow:0 0 0 999px rgba(0,0,0,.28); pointer-events:none; }
    button,a.button { border:0; border-radius:999px; padding:12px 18px; font-weight:850; cursor:pointer; background:var(--brand); color:white; text-decoration:none; }
    button.secondary { background:#e8eef7; color:var(--brand); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
    .status { min-height:28px; font-weight:900; }
    .status.ok { color:var(--ok); } .status.err { color:var(--danger); }
    .flight-support { margin:-8px 0 18px; color:var(--brand); font-size:13px; font-weight:950; letter-spacing:.12em; }
    .boarding-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0 24px; }
    .boarding-heading h1 { margin:0; min-width:0; font-size:clamp(22px,5.8vw,32px); }
    [hidden] { display:none !important; }
    .nbrd-form { display:grid; gap:14px; }
    .field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start; }
    label { display:grid; gap:8px; color:var(--muted); font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; }
    input,textarea,select { width:100%; height:56px; border:1px solid var(--line); border-radius:14px; padding:14px 16px; color:var(--ink); font:inherit; font-weight:750; background:#fbfdff; box-shadow:inset 0 1px 0 rgba(255,255,255,.7); }
    textarea { min-height:56px; resize:none; overflow:auto; line-height:1.35; }
    #nbrd-form .actions { margin-top:2px; }
    .dialog-backdrop { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:22px; background:rgba(12,20,32,.48); }
    .dialog-backdrop[hidden] { display:none; }
    .dialog-card { width:min(420px,92vw); border-radius:28px; background:rgba(255,255,255,.96); box-shadow:0 22px 70px rgba(0,0,0,.28); padding:28px; text-align:center; }
    .dialog-icon { display:grid; width:78px; height:78px; place-items:center; margin:0 auto 14px; border-radius:999px; color:white; font-size:46px; font-weight:1000; line-height:1; box-shadow:inset 0 8px 12px rgba(255,255,255,.45), inset 0 -10px 18px rgba(0,0,0,.18), 0 10px 20px rgba(0,0,0,.18); text-shadow:0 2px 4px rgba(0,0,0,.25); }
    .dialog-icon.success { background:linear-gradient(145deg,#7dff4b,#26b50f 58%,#168906); }
    .dialog-icon.infant { background:linear-gradient(145deg,#7dd3fc,#2563eb 58%,#123a73); }
    .dialog-icon.warning { background:linear-gradient(145deg,#ffe66a,#f59e0b 58%,#b45309); }
    .dialog-icon.error { background:linear-gradient(145deg,#ff8a8a,#ef2424 58%,#b42318); }
    .dialog-card h2 { margin:0 0 12px; font-size:24px; }
    .dialog-card p { margin:0 0 22px; font-size:20px; font-weight:850; color:#344054; white-space:pre-line; }
    .dialog-card input { margin:0 0 10px; }
    .dialog-card button { width:100%; font-size:18px; }
    .dialog-card .secondary { margin-top:8px; }
    @media (max-width:640px){ .field-grid{grid-template-columns:1fr} input,textarea{height:54px} .card{padding:18px} h1{font-size:34px} .camera-wrap{aspect-ratio:4 / 3;max-height:42vh} }
  </style>

  <link rel="stylesheet" href="/assets/boarding-aurora.css?v=20261013-ce777-mobile-small">

<link rel="stylesheet" href="/assets/pearl-white.css?v=20261025"></head>
<body class="pearl-white-page aviation-page aviation-scan">
  <header><a class="mufc-wordmark" href="/flights.html">MUFC</a><div class="header-actions"><a class="button" href="m-board.html">BAB</a><a class="button" href="/box.html">BOX</a></div><div class="mobile-aircraft-sky" aria-hidden="true"></div></header>
  <main>
    <section class="card" id="nbrd-section" aria-label="NBRD records">
      <div class="nbrd-heading"><h2>NBRD</h2></div>
      <div id="nbrd-bns"></div>
      <form class="nbrd-form" id="nbrd-form" aria-label="Add NBRD">
        <input id="nbrd-bn" name="bn" aria-label="BN" inputmode="numeric" pattern="\d{1,4}" placeholder="94 or 0094" required />
        <select id="nbrd-message" name="message" aria-label="NBRD Message"><option>NBRD</option><option>SEAT CHANGE</option><option>INV UPGRADE</option><option>VISA</option><option>RE-SWIPE</option></select>
        <button type="submit">Add</button>
      </form>
    </section>
    <section class="card">
      <div class="boarding-heading"><h1><span class="boarding-live-indicator" id="boarding-live-indicator" role="status" aria-label="Live boarding connection" hidden></span>Boarding</h1><a class="flight-switch" id="boarding-switch-flight" href="/flights.html" aria-label="Switch flight" title="Switch flight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v17m-4-4 4 4 4-4M17 21V4m-4 4 4-4 4 4"/></svg></a></div>
      <p class="flight-support"><span data-selected-flight>MU586 · MU9586 · MU578</span></p>
      <div class="camera-wrap"><video id="preview" muted playsinline></video><div class="aim-box" aria-hidden="true"></div></div>
      <div class="actions"><button id="start" type="button">Start Scan</button><button class="secondary" id="stop" type="button">Stop</button></div>
      <p class="status" id="status">Ready.</p>
      <p id="pending-scans" role="status" hidden></p>
    </section>
  </main>
  <div class="dialog-backdrop" id="message-dialog" hidden><div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-icon" id="dialog-icon" hidden></div><h2 id="dialog-title">Message</h2><p id="dialog-message"></p><button id="dialog-ok" type="button">OK</button></div></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <script src="/boarding-live.js?v=20261011"></script>
  <script src="/scan-outbox.js?v=20261014"></script>
  <script>
    const auth = window.firebase?.apps?.length && window.firebase?.auth ? firebase.auth() : null;
    const AUTH_SESSION_STARTED_KEY = 'mufc_auth_session_started_at';
    const AUTH_LAST_ACTIVITY_KEY = 'mufc_auth_last_activity_at';
    function loginUrl() {
      const url = new URL('login.html', window.location.href);
      url.searchParams.set('next', `${window.location.pathname}${window.location.search}${window.location.hash}`);
      return url.href;
    }
    function markAuthActivity() {
      (window.localStorage || window.sessionStorage).setItem(AUTH_LAST_ACTIVITY_KEY, String(Date.now()));
    }
    function requireLogin() {
      if (!auth) { window.location.replace(loginUrl()); return; }
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          window.location.replace(loginUrl());
          return;
        }
        markAuthActivity();
      });
    }
    requireLogin();
    const apiBase = (window.MU_API_BASE || 'https://api.mufcapp.net').replace(/\/$/, '');
    const boardingLiveIndicator = document.querySelector('#boarding-live-indicator');
    const nbrdLiveStatus = document.createElement('p');
    nbrdLiveStatus.setAttribute('role', 'status');
    nbrdLiveStatus.className = 'nbrd-add-status';
    nbrdLiveStatus.hidden = true;
    document.querySelector('#nbrd-form').append(nbrdLiveStatus);
    let liveNbrd = [];
    let liveNbrdFresh = false;
    connectBoardingLive({
      apiBase,
      onBoard(data) {
        liveNbrd = (data.rows || []).filter(row => row.nbrdBn);
        liveNbrdFresh = data.nbrdFresh === true;
        nbrdReview.render(data.rows || []);
        nbrdLiveStatus.hidden = liveNbrdFresh;
        nbrdLiveStatus.textContent = data.nbrdFresh
          ? `NBRD live · ${liveNbrd.length} entries`
          : 'NBRD updates unavailable. Please wait before scanning.';
      },
      onStatus(status) {
        boardingLiveIndicator.hidden = status !== 'Live';
        nbrdLiveStatus.hidden = (status === 'Live' && liveNbrdFresh) || status === 'Manual refresh';
        nbrdLiveStatus.textContent = status === 'Live'
          ? (liveNbrdFresh ? `NBRD live · ${liveNbrd.length} entries` : 'NBRD updates unavailable. Please wait before scanning.')
          : (status === 'Manual refresh' ? 'NBRD checked when scanning' : `NBRD · ${status}`);
      }
    });
    const statusEl = document.querySelector('#status');

    const preview = document.querySelector('#preview');
    const dialog = document.querySelector('#message-dialog');
    const dialogMessage = document.querySelector('#dialog-message');
    const dialogIcon = document.querySelector('#dialog-icon');
    const dialogOk = document.querySelector('#dialog-ok');
    let controls = null;
    let scanBusy = false;
    let lastScanText = '';
    let lastScanAt = 0;
    const cameraConstraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    };
    function setStatus(text, cls = '') { statusEl.textContent = text; statusEl.className = `status ${cls}`.trim(); }
    async function applyCameraFocus() {
      const track = preview.srcObject?.getVideoTracks?.()[0];
      if (!track?.applyConstraints) return;
      const capabilities = track.getCapabilities?.() || {};
      const continuousModes = ['focusMode', 'exposureMode', 'whiteBalanceMode'];
      for (const mode of continuousModes) {
        if (!Array.isArray(capabilities[mode]) || !capabilities[mode].includes('continuous')) continue;
        // Apply supported modes separately. Some mobile browsers reject the whole
        // advanced constraint list when even one camera control is unsupported.
        await track.applyConstraints({ advanced: [{ [mode]: 'continuous' }] }).catch(() => {});
      }
    }
    function showMessage(message, title = 'Message', type = '') {
      document.querySelector('#dialog-title').textContent = title;
      dialogMessage.textContent = message;
      const icons = { success:'✓', infant:'✓', warning:'!', error:'✕' };
      dialogIcon.hidden = !icons[type];
      dialogIcon.textContent = icons[type] || '';
      dialogIcon.className = `dialog-icon ${type || ''}`.trim();
      dialog.hidden = false;
      dialogOk.focus();
    }
    function hideMessage() { dialog.hidden = true; if (controls && !scanBusy) setStatus('Scanning'); void scanOutbox?.pump(); }
    dialogOk.addEventListener('click', hideMessage);
    const nbrdReview = NbrdReview.create({container:document.querySelector('#nbrd-bns'), apiBase, onChanged:refreshNbrd});
    const nbrdReviewTokens = new Map();
    let nbrdVerified = false;
    async function refreshNbrd() {
      await nbrdReview.load();
    }
    async function verifyNbrd() {
      document.querySelector('#start').disabled = true;
      await refreshNbrd();
      nbrdVerified = await nbrdReview.verify();
      document.querySelector('#start').disabled = !nbrdVerified;
      if (!nbrdVerified) { document.querySelector('#nbrd-form').scrollIntoView({behavior:'smooth'}); document.querySelector('#nbrd-bn').focus(); }
    }
    async function saveScan(rawScan, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      let res, data;
      try {
        res = await fetch(apiBase+'/cbs-scan', {method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({rawScan, requestId:options.requestId, reviewToken:nbrdReviewTokens.get(rawScan), confirmationToken:options.confirmationToken})});
        data = await res.json();
      } catch (error) { throw Object.assign(new Error('保存未确认，已保留待提交记录。恢复连接后重试。'), { retryable:true }); }
      finally { clearTimeout(timeout); }
      options.onResponse?.();
      if (!res.ok) {
        if (data.code === 'NBRD_MESSAGE') {
          nbrdReviewTokens.set(rawScan, data.confirmationToken);
          if (!data.canBoard) showMessage('NBRD message' + (data.detail ? '\n'+data.detail : ''), 'Message', 'warning');
          else {
            const boarded = await nbrdReview.board({bn:data.bn,detail:data.detail,confirm:()=>saveScan(rawScan,{...options,confirmationToken:data.confirmationToken})});
            if (boarded) return;
            setStatus('NBRD retained. Scan again when ready.', 'err');
          }
          return;
        }
        const message = data.code === 'WRONG_FLIGHT' ? 'wrong flight' : data.code === 'DUPLICATE_BN' ? 'Duplicate BN' : data.code === 'SHEETS_QUOTA' ? 'Not saved. Please try again after Google Sheets recovers.' : data.error || 'Scan failed';
        throw Object.assign(new Error(message), { retryable:res.status >= 500 || res.status === 429 || !['WRONG_FLIGHT','DUPLICATE_BN','SCAN_FORMAT','SCAN_ERROR'].includes(data.code) });
      }
      if (data.ok !== true || !data.bn || !Number.isInteger(data.rowNumber)) throw Object.assign(new Error('保存未确认，待提交记录已保留。'), { retryable:true });
      nbrdReviewTokens.delete(rawScan);
      setStatus(data.isInfant ? 'Saved INFANT BN '+data.bn : 'Saved BN '+data.bn, 'ok');
      showMessage(data.isInfant ? 'Input successful infant BN '+data.bn : 'Input successful BN '+data.bn, data.isInfant ? 'Infant' : 'Success', data.isInfant ? 'infant' : 'success');
      if (Array.isArray(data.nbrdRows)) nbrdReview.render(data.nbrdRows);
      else refreshNbrd().catch(()=>{});
    }
    async function handleText(item) {
      const startButton = document.querySelector('#start');
      startButton.disabled = true;
      setStatus('Saving...');
      const waitingTimer = setTimeout(() => {
        setStatus('等待，请保持页面打开。');
        showMessage('等待，请保持页面打开。');
        dialogOk.disabled = true;
      }, 3000);
      try {
        await saveScan(item.text, {requestId:item.id,onResponse:()=>clearTimeout(waitingTimer)});
        return true;
      } catch (err) {
        setStatus(err.message, 'err');
        if (err.retryable) dialog.hidden = true;
        else showMessage(err.message || 'Not saved. Please scan again.', 'Message', 'error');
        return !err.retryable;
      } finally {
        clearTimeout(waitingTimer);
        dialogOk.disabled = false;
        startButton.disabled = !nbrdVerified;
      }
    }
    let scanOutbox;
    try {
      let tabId = sessionStorage.getItem('boarding-scan-tab');
      if (!tabId) { tabId = crypto.randomUUID(); sessionStorage.setItem('boarding-scan-tab', tabId); }
      const flight = window.mufcFlight;
      if (!flight) throw new Error('Please select a flight.');
      scanOutbox = createScanOutbox({storage:localStorage,key:`boarding-outbox:${tabId}:${flight.flightNo}:${flight.flightDate}`,
        canSubmit:()=>nbrdVerified && dialog.hidden && !nbrdReview.isOpen(),
        submit:async item=>{ scanBusy=true; try { return await handleText(item); } finally { scanBusy=false; } },
        onChanged:count=>{ const el=document.querySelector('#pending-scans'); el.hidden=!count; el.textContent=`待保存 ${count} 张，请勿放行未显示保存成功的旅客。`; },
        onError:error=>{ controls?.stop(); controls=null; showMessage('Unable to retain scan. '+error.message, 'Message', 'error'); }
      });
      setInterval(()=>void scanOutbox.pump(), 1000);
      window.addEventListener('online', ()=>void scanOutbox.pump());
      window.addEventListener('beforeunload', event=>{ if (scanOutbox.pending) { event.preventDefault(); event.returnValue=''; } });
    } catch (error) { setStatus(error.message, 'err'); showMessage(error.message, 'Message', 'error'); }
    document.querySelector('#nbrd-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const bnInput = document.querySelector('#nbrd-bn');
      const messageInput = document.querySelector('#nbrd-message');
      const bn = String(bnInput.value || '').replace(/\D/g, '');
      const detail = messageInput.value;
      if (!/^\d{1,4}$/.test(bn)) { showMessage('BN must be 1 to 4 digits.'); return; }
      if (!detail) { showMessage('NBRD message is required.'); return; }
      try {
        setStatus('Saving NBRD...');
        const res = await fetch(`${apiBase}/cbs-scan/nbrd-bns`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ entries:[{ bn, detail }] }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'NBRD save failed');
        bnInput.value = '';
        messageInput.value = 'NBRD';
        await refreshNbrd();
        if (!nbrdVerified) { nbrdVerified = await nbrdReview.verify(); document.querySelector('#start').disabled = !nbrdVerified; }
        setStatus(`Saved NBRD BN ${String(bn).padStart(4, '0').slice(-3)}`, 'ok');
        showMessage(`NBRD saved BN ${String(bn).padStart(4, '0').slice(-3)}`, 'Success', 'success');
      } catch (err) {
        setStatus(err.message || 'NBRD save failed', 'err');
        showMessage(err.message || 'NBRD save failed');
      }
    });
    document.querySelector('#start').addEventListener('click', async () => {
      try {
        if (!nbrdVerified || nbrdReview.isOpen() || !scanOutbox || controls) return;
        if (!window.ZXingBrowser) throw new Error('ZXing library did not load.');
        const Reader = ZXingBrowser.BrowserPDF417Reader || ZXingBrowser.BrowserMultiFormatReader;
        const reader = new Reader();
        const decode = typeof reader.decodeFromConstraints === 'function'
          ? reader.decodeFromConstraints.bind(reader, cameraConstraints)
          : reader.decodeFromVideoDevice.bind(reader, undefined);
        controls = await decode(preview, (result, error) => {
          if (!result || !nbrdVerified) return;
          const text = result.getText();
          const now = Date.now();
          if (text === lastScanText && !dialog.hidden) return;
          if (text === lastScanText && now - lastScanAt < 2500) return;
          try {
            scanOutbox.capture(text);
            lastScanText = text;
            lastScanAt = now;
          } catch (error) {
            controls?.stop(); controls=null;
            setStatus('Not saved. '+error.message, 'err');
            showMessage('Not saved. Unable to retain scan. Please scan again after resolving storage.', 'Message', 'error');
          }
        });
        await applyCameraFocus();
        setStatus('Scanning');
      } catch (err) { setStatus(err.message, 'err'); showMessage(err.message); }
    });
    verifyNbrd().catch(err=>{ setStatus(err.message, 'err'); showMessage(err.message+' Please reload to check NBRD.', 'Message', 'error'); });
    document.querySelector('#stop').addEventListener('click', () => { controls?.stop(); controls = null; setStatus('Stopped.'); });
  </script>
</body>
</html>
