<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MU Manual Boarding</title>
  <style>
    :root{--brand:#6b3fa0;--brand2:#945ed1;--page:#f7f3fb;--line:#dfd2ec;--ink:#2f2440;--muted:#786b88;--ok:#18794e;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#f2eafa,#fff 58%,#f6f1fb)}button{font:inherit;cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:224px;display:flex;flex-direction:column;padding:28px 18px;color:#fff;background:linear-gradient(180deg,#4d2879,#7544a6);box-shadow:8px 0 28px #3c185526}.brand{color:#fff;font-size:23px;font-weight:950;letter-spacing:.12em;text-decoration:none}.kicker{margin:4px 0 28px;color:#decbed;font-size:11px;font-weight:850;letter-spacing:.12em}.side-link{margin-top:auto;padding:12px 14px;border-radius:11px;color:#f6edff;font-weight:800;text-decoration:none}.side-link:hover{background:#ffffff1d}.workspace{min-height:100vh;margin-left:224px;padding:26px}.card{min-height:calc(100vh - 52px);padding:24px;border:1px solid var(--line);border-radius:22px;background:#ffffffed;box-shadow:0 18px 42px #41245a14}.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}.topbar h1{margin:0;font-size:27px}.flight-status{display:flex;gap:10px;margin-left:auto}.metric{min-width:92px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#faf7fd}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.08em}.metric strong{font-size:20px}.controls{display:flex;gap:9px}.action{border:0;border-radius:10px;padding:11px 18px;color:white;background:var(--brand);font-weight:900}.action.stop{background:#eee8f4;color:#513271}.action:disabled{opacity:.45;cursor:not-allowed}.state{display:flex;align-items:center;gap:9px;margin:0 0 18px;color:var(--muted);font-weight:750}.dot{width:10px;height:10px;border-radius:50%;background:#98a2b3}.state.running .dot{background:#27ae60;box-shadow:0 0 0 5px #27ae6020}.state.error{color:var(--danger)}.records{display:grid;gap:12px}.empty{padding:60px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}.record{display:grid;grid-template-columns:52px minmax(170px,1.25fr) repeat(4,minmax(95px,.7fr)) auto;gap:13px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 7px 18px #4b22620c}.bn{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#efe3f9;color:var(--brand);font-size:19px;font-weight:950}.field span{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.field strong{overflow-wrap:anywhere}.record-actions{display:flex;gap:7px}.small{border:0;border-radius:9px;padding:9px 12px;background:#efe7f7;color:#57327d;font-size:12px;font-weight:900}.small.primary{background:var(--brand);color:white}
    .print-stage{display:none}@media(max-width:980px){.record{grid-template-columns:52px repeat(2,minmax(0,1fr))}.record-actions{grid-column:2/-1}}@media(max-width:640px){.sidebar{position:static;width:100%;height:auto;flex-direction:row;align-items:center;padding:18px}.kicker{margin:0 0 0 12px}.side-link{margin:0 0 0 auto}.workspace{margin:0;padding:12px}.card{padding:17px}.flight-status{margin-left:0;width:100%}.record{grid-template-columns:48px 1fr}.record-actions{grid-column:1/-1}.controls{width:100%}.controls button{flex:1}}
  </style>
</head>
<body>
  <aside class="sidebar"><a class="brand" href="index.html">MUFC</a><div class="kicker">Manual Boarding</div><a class="side-link" href="index.html">← Flight dashboard</a></aside>
  <main class="workspace"><section class="card">
    <div class="topbar"><div><h1>Manual Boarding</h1><div id="flight-label">MU586 passenger records</div></div><div class="flight-status"><div class="metric"><span>GATE</span><strong id="gate">---</strong></div><div class="metric"><span>BDT</span><strong id="bdt">----</strong></div></div><div class="controls"><button class="action" id="start" type="button">Start</button><button class="action stop" id="stop" type="button" disabled>Stop</button></div></div>
    <p class="state" id="state"><span class="dot"></span><span>Stopped — no log or Google Sheet requests are running.</span></p>
    <div class="records" id="records"><div class="empty">Press Start to collect passengers with a BN and PNR.</div></div>
  </section></main>
  <script>
    const apiBase=(window.MU_API_BASE||'https://api.mufcapp.net').replace(/\/$/,'');
    const $=(selector)=>document.querySelector(selector);let timer=null;let currentRecords=[];let busy=false;
    const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function setState(text,type=''){ $('#state').className=`state ${type}`.trim();$('#state span:last-child').textContent=text; }
    function passMarkup(record){const barcode=`${apiBase}/manual/barcode?data=${encodeURIComponent(record.barcode)}`;return `<article class="pass"><header><b>中国东方航空<br><small>CHINA EASTERN</small></b><b>登机牌<br><small>BOARDING PASS</small></b></header><section><div><label>NAME / 姓名</label><strong>${escapeHtml(record.name)}</strong></div><div><label>FLIGHT / 航班</label><strong>${escapeHtml(record.flight)}</strong></div><div><label>DATE / 日期</label><strong>${escapeHtml(record.flightDate)}</strong></div><div><label>FROM / TO</label><strong>LAX → PVG</strong></div><div><label>SEAT / 座位</label><strong>${escapeHtml(record.seat)}</strong></div><div><label>BN</label><strong>${escapeHtml(record.bn)}</strong></div><div><label>GATE / 登机口</label><strong>${escapeHtml(record.gate||'---')}</strong></div><div><label>BOARDING TIME / 登机时间</label><strong>${escapeHtml(record.bdt||'----')}</strong></div><div><label>PNR</label><strong>${escapeHtml(record.pnr)}</strong></div><div><label>TICKET</label><strong>${escapeHtml(record.ticketNumber||'—')}</strong></div></section><img src="${barcode}" alt="PDF417 barcode"><footer>GATE WILL BE CLOSED 20 MINUTES BEFORE DEPARTURE.</footer></article>`}
    function documentMarkup(record){return `<!doctype html><html><head><meta charset="utf-8"><title>Boarding Pass ${escapeHtml(record.bn)}</title><style>@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#20202a}.pass{height:132mm;margin:0 0 8mm;border:2px solid #60408c;break-inside:avoid}.pass header{display:flex;justify-content:space-between;padding:14px 20px;color:white;background:#60408c;font-size:20px}.pass small{font-size:11px}.pass section{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:22px}.pass section div:first-child{grid-column:span 2}.pass label{display:block;color:#777;font-size:9px;font-weight:bold}.pass strong{font-size:17px}.pass img{display:block;width:62%;height:76px;object-fit:fill;margin:6px auto}.pass footer{padding:9px 20px;border-top:1px solid #aaa;font-size:11px;font-weight:bold;text-align:center}</style></head><body>${passMarkup(record)}${passMarkup(record)}</body></html>`}
    function openPrint(index){const record=currentRecords[index];if(!record)return;const win=window.open('','_blank');win.document.write(documentMarkup(record));win.document.close();win.addEventListener('load',()=>setTimeout(()=>win.print(),250));}
    function download(index){const record=currentRecords[index];if(!record)return;const blob=new Blob([documentMarkup(record)],{type:'text/html'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`MU-${record.flight}-${record.flightDate}-BN${record.bn}.html`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
    function render(records){currentRecords=records;$('#records').innerHTML=records.length?records.map((record,index)=>`<article class="record"><div class="bn">${escapeHtml(record.bn)}</div><div class="field"><span>Passenger</span><strong>${escapeHtml(record.name)}</strong></div><div class="field"><span>Seat</span><strong>${escapeHtml(record.seat)}</strong></div><div class="field"><span>Ticket</span><strong>${escapeHtml(record.ticketNumber||'—')}</strong></div><div class="field"><span>Membership</span><strong>${escapeHtml(record.membershipNumber||'—')}</strong></div><div class="field"><span>PNR</span><strong>${escapeHtml(record.pnr)}</strong></div><div class="record-actions"><button class="small primary" onclick="openPrint(${index})">Print / PDF</button><button class="small" onclick="download(${index})">Download</button></div></article>`).join(''):'<div class="empty">No passengers with both BN and PNR were found yet.</div>';}
    async function refresh(){if(busy||!timer)return;busy=true;try{const response=await fetch(`${apiBase}/manual/records`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Unable to load records.');$('#gate').textContent=data.gate||'---';$('#bdt').textContent=data.bdt||'----';$('#flight-label').textContent=`${data.flight||'MU586'} passenger records`;render(data.records||[]);setState(`Running — ${(data.records||[]).length} records synced. Next refresh in 60 seconds.`,'running')}catch(error){setState(error.message||'Sync failed.','error')}finally{busy=false}}
    function start(){if(timer)return;localStorage.setItem('manualBoardingEnabled','true');timer=setInterval(refresh,60000);$('#start').disabled=true;$('#stop').disabled=false;setState('Starting…','running');refresh()}
    function stop(){clearInterval(timer);timer=null;localStorage.removeItem('manualBoardingEnabled');$('#start').disabled=false;$('#stop').disabled=true;setState('Stopped — no log or Google Sheet requests are running.')}
    $('#start').addEventListener('click',start);$('#stop').addEventListener('click',stop);if(localStorage.getItem('manualBoardingEnabled')==='true')start();
  </script>
</body></html>
