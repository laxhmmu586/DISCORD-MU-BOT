<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Record Scanner</title>
  <style>
    :root{--night:#07111f;--panel:#101f34;--line:#29405d;--ink:#eef7ff;--muted:#9db0c8;--cyan:#2dd4bf;--blue:#38bdf8;--danger:#fb7185}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,"Noto Sans SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 5%,#123d59 0,transparent 32rem),linear-gradient(145deg,#050b15,#0b1728)}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,52px);border-bottom:1px solid var(--line);background:rgba(7,17,31,.78);backdrop-filter:blur(14px)}.brand{color:var(--ink);font-weight:950;letter-spacing:.14em;text-decoration:none}.flight-badge{padding:8px 14px;border:1px solid #2d7185;border-radius:999px;color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.08em}
    main{width:min(900px,94vw);margin:32px auto}.card{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(18,37,61,.96),rgba(10,25,43,.96));box-shadow:0 26px 70px rgba(0,0,0,.34)}h1{margin:0 0 8px;font-size:clamp(32px,6vw,58px);letter-spacing:-.04em}.lead{margin:0 0 24px;color:var(--muted);font-weight:700}
    .camera-wrap{position:relative;overflow:hidden;border:1px solid #315472;border-radius:22px;background:#02050a}video{display:block;width:100%;max-height:58vh;object-fit:cover}.aim-box{position:absolute;left:50%;top:50%;width:min(80%,590px);height:32%;transform:translate(-50%,-50%);border:2px solid var(--cyan);border-radius:14px;box-shadow:0 0 0 999px rgba(1,6,12,.48),0 0 24px rgba(45,212,191,.36);pointer-events:none}.aim-box:after{content:"PDF417";position:absolute;right:10px;top:8px;color:var(--cyan);font-size:10px;font-weight:950;letter-spacing:.12em}
    button{border:0;border-radius:14px;padding:13px 20px;font:inherit;font-weight:900;cursor:pointer;color:#03131a;background:linear-gradient(135deg,var(--cyan),var(--blue))}button.secondary{color:var(--ink);background:#203650}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{min-height:26px;color:var(--muted);font-weight:850}.status.ok{color:var(--cyan)}.status.err{color:var(--danger)}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.result div{padding:16px;border:1px solid var(--line);border-radius:16px;background:#091727}.result b{display:block;margin-bottom:6px;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .dialog{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(1,5,10,.74)}.dialog[hidden]{display:none}.dialog-card{width:min(400px,92vw);padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--panel);text-align:center;box-shadow:0 30px 80px #000}.dialog-icon{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 14px;border-radius:50%;background:var(--cyan);color:#03131a;font-size:40px;font-weight:1000}.dialog-icon.error{background:var(--danger)}.dialog-card h2{margin:0 0 10px}.dialog-card p{margin:0 0 22px;color:var(--muted);font-size:18px;font-weight:800;white-space:pre-line}.dialog-card button{width:100%}@media(max-width:600px){.result{grid-template-columns:1fr}.card{border-radius:20px}h1{font-size:36px}}
  </style>
</head>
<body>
  <header><a class="brand" href="index.html">MUFC</a><span class="flight-badge">MU586 · MU9586</span></header>
  <main><section class="card"><h1>Record Scanner</h1><p class="lead">Scan a boarding pass to record BN, seat and flight number.</p><div class="camera-wrap"><video id="preview" muted playsinline></video><div class="aim-box" aria-hidden="true"></div></div><div class="actions"><button id="start" type="button">Start Scan</button><button class="secondary" id="stop" type="button">Stop</button></div><p class="status" id="status">Ready for MU586 or MU9586.</p><div class="result" id="result" hidden></div></section></main>
  <div class="dialog" id="dialog" hidden><div class="dialog-card" role="dialog" aria-modal="true"><div class="dialog-icon" id="dialog-icon">✓</div><h2 id="dialog-title">Success</h2><p id="dialog-message"></p><button id="dialog-ok" type="button">OK</button></div></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js"></script><script src="https://unpkg.com/@zxing/browser@latest"></script>
  <script>
    const auth=window.firebase?.apps?.length&&window.firebase?.auth?firebase.auth():null;function loginUrl(){const url=new URL('login.html',location.href);url.searchParams.set('next',`${location.pathname}${location.search}${location.hash}`);return url.href}if(!auth)location.replace(loginUrl());else auth.onAuthStateChanged(user=>{if(!user)location.replace(loginUrl())});
    const apiBase=(window.MU_API_BASE||'https://api.mufcapp.net').replace(/\/$/,'');const preview=document.querySelector('#preview'),statusEl=document.querySelector('#status'),resultEl=document.querySelector('#result'),dialog=document.querySelector('#dialog');let controls=null,scanBusy=false,lastText='',lastAt=0;
    const cameraConstraints={video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},focusMode:{ideal:'continuous'},advanced:[{focusMode:'continuous'}]},audio:false};
    function setStatus(text,type=''){statusEl.textContent=text;statusEl.className=`status ${type}`.trim()}function show(message,error=false){document.querySelector('#dialog-title').textContent=error?'Unable to save':'Recorded';document.querySelector('#dialog-message').textContent=message;const icon=document.querySelector('#dialog-icon');icon.textContent=error?'✕':'✓';icon.className=`dialog-icon${error?' error':''}`;dialog.hidden=false;document.querySelector('#dialog-ok').focus()}document.querySelector('#dialog-ok').onclick=()=>dialog.hidden=true;
    function render(data){resultEl.hidden=false;resultEl.innerHTML=`<div><b>BN</b>${data.bn||''}</div><div><b>Seat</b>${data.seat||''}</div><div><b>Flight Number</b>${data.flight||''}</div>`}
    async function saveScan(rawScan){const res=await fetch(`${apiBase}/record-scan`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rawScan})});const data=await res.json().catch(()=>({}));if(!res.ok){const message=data.code==='WRONG_FLIGHT'?'Only MU586 and MU9586 are supported.':data.code==='DUPLICATE_BN'?`Duplicate BN: ${(String(rawScan).match(/(?:^|\D)(?:0*INF|0*\d{1,3}[A-Z])(\d{3,4})\b/i)?.[1]||'').slice(-3)}`:data.code==='SHEETS_QUOTA'?'Google Sheets is busy. Please scan again shortly.':data.error||'Scan failed';throw new Error(message)}render(data);setStatus(`Saved BN ${data.bn} / ${data.seat} / ${data.flight}`,'ok');show(`BN ${data.bn}\nSeat ${data.seat}\nFlight ${data.flight}`)}
    async function applyFocus(){const track=preview.srcObject?.getVideoTracks?.()[0],caps=track?.getCapabilities?.()||{};if(!track?.applyConstraints)return;const advanced=[];if(caps.focusMode?.includes('continuous'))advanced.push({focusMode:'continuous'});if(caps.zoom){advanced.push({zoom:Math.min(caps.zoom.max,Math.max(caps.zoom.min,1.4))})}if(advanced.length)await track.applyConstraints({advanced}).catch(()=>{})}
    document.querySelector('#start').onclick=async()=>{try{if(!window.ZXingBrowser)throw new Error('Scanner library did not load.');const Reader=ZXingBrowser.BrowserPDF417Reader||ZXingBrowser.BrowserMultiFormatReader,reader=new Reader(),decode=typeof reader.decodeFromConstraints==='function'?reader.decodeFromConstraints.bind(reader,cameraConstraints):reader.decodeFromVideoDevice.bind(reader,undefined);controls=await decode(preview,result=>{if(!result||scanBusy)return;const text=result.getText(),now=Date.now();if(text===lastText&&now-lastAt<2500)return;scanBusy=true;lastText=text;lastAt=now;setStatus('Detected. Saving...');saveScan(text).catch(err=>{setStatus(err.message,'err');show(err.message,true)}).finally(()=>setTimeout(()=>{scanBusy=false;if(controls)setStatus('Scanning MU586 / MU9586')},1500))});await applyFocus();setStatus('Scanning MU586 / MU9586')}catch(err){setStatus(err.message,'err');show(err.message,true)}};
    document.querySelector('#stop').onclick=()=>{controls?.stop();controls=null;setStatus('Stopped.')};
  </script>
</body>
</html>
