<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Record Case Center</title><style>
:root{--night:#07111f;--panel:#102035;--line:#29415e;--ink:#edf6ff;--muted:#9db0c8;--cyan:#2dd4bf;--blue:#38bdf8;--amber:#f5bf4f}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,Arial,"Noto Sans SC",sans-serif;background:radial-gradient(circle at 85% 0,#123d59,transparent 31rem),#07111f}header{display:flex;align-items:center;gap:18px;padding:17px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:#07111fd9;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{font-weight:950;letter-spacing:.12em}.badge{color:var(--cyan);font-size:12px}.refresh{margin-left:auto}button,input,select,textarea{font:inherit}button{padding:10px 14px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03131a;font-weight:900;cursor:pointer}main{width:min(1280px,95vw);margin:28px auto}.hero{display:flex;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:20px}h1{margin:0;font-size:clamp(30px,5vw,52px)}.hero p{margin:5px 0;color:var(--muted)}.search{margin-left:auto;width:min(360px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#0c192a}.stats{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}.stat{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.cases{display:grid;gap:15px}.case{border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:18px;background:linear-gradient(145deg,#11243b,#0b192a);box-shadow:0 15px 38px #0003}.case.done{border-left-color:var(--cyan)}.head{display:grid;grid-template-columns:90px minmax(150px,1fr) repeat(3,minmax(100px,.6fr));gap:12px;padding:17px;align-items:center;cursor:pointer}.bn{font-size:25px;font-weight:950;color:var(--cyan)}.label{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.detail{display:none;padding:0 17px 18px;border-top:1px solid var(--line)}.case.open .detail{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}.box{padding:13px;border:1px solid var(--line);border-radius:12px;background:#081525;white-space:pre-wrap;overflow-wrap:anywhere}.wide{grid-column:1/-1}.edit{display:grid;grid-template-columns:180px 1fr 2fr auto;gap:10px;margin-top:15px}.edit input,.edit select,.edit textarea{width:100%;padding:11px;border:1px solid #35506d;border-radius:10px;background:#071321;color:var(--ink)}.edit textarea{min-height:44px;resize:vertical}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.status{color:var(--amber);font-weight:850}.done .status{color:var(--cyan)}@media(max-width:800px){.head{grid-template-columns:80px 1fr}.head>div:nth-child(n+3){display:none}.grid,.edit{grid-template-columns:1fr}.wide{grid-column:auto}.search{margin-left:0}.hero{align-items:start}}
</style></head><body><header><span class="brand">MUBC</span><span class="badge">RECORD CASE CENTER · 集中处理站</span><button class="refresh" id="refresh">Refresh</button></header><main><div class="hero"><div><h1>Special Handling Cases</h1><p>Live case queue · Google Sheets archive · 多人实时处理</p></div><input class="search" id="search" placeholder="Search BN, name, destination, ticket…"></div><div class="stats" id="stats"></div><section class="cases" id="cases"><div class="empty">Loading cases…</div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js" onerror="this.remove()"></script><script>
const apiBase=(window.MU_API_BASE||'https://api.mufcapp.net').replace(/\/$/,''),casesEl=document.querySelector('#cases'),stats=document.querySelector('#stats'),search=document.querySelector('#search');let rows=[],expanded=new Set(),loading=false;
const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));function loginUrl(){const url=new URL('login.html',location.href);url.searchParams.set('next',location.pathname+location.search);return url.href}const auth=window.firebase?.apps?.length&&window.firebase?.auth?firebase.auth():null;if(auth)auth.onAuthStateChanged(user=>{if(!user)location.replace(loginUrl())});
function render(){const q=search.value.trim().toLowerCase(),visible=rows.filter(row=>Object.values(row).join(' ').toLowerCase().includes(q));const waiting=rows.filter(row=>!['completed','closed'].includes(String(row.status).toLowerCase())).length;stats.innerHTML=`<span class="stat">${rows.length} total</span><span class="stat">${waiting} active</span><span class="stat">Auto refresh: 5 sec</span>`;if(!visible.length){casesEl.innerHTML='<div class="empty">No matching cases.</div>';return}casesEl.innerHTML=visible.slice().reverse().map(row=>{const done=['completed','closed'].includes(String(row.status).toLowerCase()),open=expanded.has(row.rowNumber);return `<article class="case ${done?'done':''} ${open?'open':''}" data-row="${row.rowNumber}"><div class="head" data-toggle><div><span class="label">BN</span><span class="bn">${esc(row.bn)}</span></div><div><span class="label">Passenger</span><strong>${esc(row.passengerName)||'—'}</strong></div><div><span class="label">Status</span><span class="status">${esc(row.status)}</span></div><div><span class="label">Destination</span>${esc(row.finalDestination)}</div><div><span class="label">Submitted</span>${esc(new Date(row.submittedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}</div></div><div class="detail"><div class="grid"><div class="box"><span class="label">Contact</span>${esc(row.phone)}<br>${esc(row.email)}</div><div class="box"><span class="label">Travel party / Companion BN</span>${esc(row.travelParty)} · ${esc(row.companionBns)||'—'}</div><div class="box wide"><span class="label">Passenger intention</span>${esc(row.intention)}</div><div class="box wide"><span class="label">PNR record</span>${esc(row.pnrRecord)||'No record'}</div>${row.companionPnrRecords?`<div class="box wide"><span class="label">Companion PNR records</span>${esc(row.companionPnrRecords)}</div>`:''}</div><form class="edit"><select name="status"><option>Waiting</option><option>In Progress</option><option>Pending Passenger</option><option>Completed</option><option>Closed</option></select><input name="newTicketNumber" value="${esc(row.newTicketNumber)}" placeholder="New ticket number"><textarea name="comment" placeholder="Comment / 留言">${esc(row.comment)}</textarea><button>Update</button></form><small>Last update: ${esc(row.updatedAt||'—')} ${row.updatedBy?'by '+esc(row.updatedBy):''}</small></div></article>`}).join('');visible.forEach(row=>{const article=casesEl.querySelector(`[data-row="${row.rowNumber}"]`);if(article){article.querySelector('select').value=row.status||'Waiting'}})}
casesEl.onclick=event=>{const toggle=event.target.closest('[data-toggle]');if(!toggle)return;const number=Number(toggle.closest('.case').dataset.row);expanded.has(number)?expanded.delete(number):expanded.add(number);render()};casesEl.onsubmit=async event=>{event.preventDefault();const form=event.target,rowNumber=Number(form.closest('.case').dataset.row),button=form.querySelector('button');button.disabled=true;button.textContent='Saving…';try{const body=Object.fromEntries(new FormData(form));body.updatedBy=auth?.currentUser?.email||'Agent';const response=await fetch(`${apiBase}/record-cases/${rowNumber}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw new Error(result.error);rows=rows.map(row=>row.rowNumber===rowNumber?result.record:row);render()}catch(error){alert(error.message)}finally{if(button.isConnected){button.disabled=false;button.textContent='Update'}}};
async function load(){if(loading)return;loading=true;try{const response=await fetch(`${apiBase}/record-cases`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error);rows=data.rows||[];render()}catch(error){casesEl.innerHTML=`<div class="empty">${esc(error.message)}</div>`}finally{loading=false}}search.oninput=render;document.querySelector('#refresh').onclick=load;load();setInterval(load,5000);
</script></body></html>
