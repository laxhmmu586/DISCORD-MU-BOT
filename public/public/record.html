<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUFC Case Center</title>
<style>
:root{--brand:#123a73;--brand2:#1b4b86;--page:#edf5fc;--line:#cfdeed;--ink:#0c2d55;--muted:#687b91;--white:#fff;--waiting:#2376d7;--progress:#e79b25;--hotel:#16876c}*{box-sizing:border-box}html,body{max-width:100%;min-height:100%;overflow-x:hidden}body{margin:0;padding-left:224px;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(120deg,#e8f3fc,#f8fbfe)}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:224px;display:flex;flex-direction:column;padding:28px 16px 22px;color:#fff;background:linear-gradient(180deg,#1c477f,#103568);box-shadow:8px 0 28px #1642741c;z-index:10}.brand{padding:0 12px 5px;color:#fff;font-size:23px;font-weight:950;letter-spacing:.12em}.kicker{padding:0 12px 17px;color:#b8d2ed;font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:8px}.nav button,.side-action{display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border:1px solid transparent;border-radius:11px;color:#dceafb;background:transparent;font-weight:800;text-align:left}.nav button:hover,.nav button.active{border-color:#72ace8;background:#ffffff20;color:#fff;box-shadow:inset 3px 0 #8ac8ff}.nav svg,.side-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}.nav .count{margin-left:auto;min-width:25px;padding:2px 7px;border-radius:999px;background:#ffffff20;text-align:center;font-size:12px}.side-bottom{display:grid;gap:4px;margin-top:auto}.side-action{border:0}.workspace{min-height:100vh;padding:25px 28px}.card{min-height:calc(100vh - 50px);padding:22px;border:1px solid var(--line);border-radius:20px;background:#ffffffee;box-shadow:0 18px 42px #163d6812}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:18px}.topbar h1{margin:0;font-size:25px}.search{margin-left:auto;width:min(330px,100%);padding:11px 14px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff;outline:0}.search:focus{border-color:#5697d5;box-shadow:0 0 0 3px #5697d51c}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,250px));gap:13px;margin-bottom:20px}.summary button{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;min-height:90px;padding:15px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#f8fbff;text-align:left}.summary button.active{border:2px solid var(--waiting);background:#edf6ff}.summary button[data-view="In Progress"].active{border-color:var(--progress);background:#fff8ea}.summary button[data-view="Hotel"].active{border-color:var(--hotel);background:#ebfaf5}.summary .icon{display:grid;place-items:center;width:37px;height:37px;border-radius:10px;color:#fff;background:var(--waiting);font-size:18px}.summary button[data-view="In Progress"] .icon{background:var(--progress)}.summary button[data-view="Hotel"] .icon{background:var(--hotel)}.summary small{display:block;color:var(--muted);font-weight:750}.summary strong{font-size:28px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:16px}.panel-title{display:flex;align-items:center;padding:12px 15px;background:#deedfa;font-weight:900}.panel-title span{margin-left:6px}.cases{display:grid}.empty{padding:45px;text-align:center;color:var(--muted)}.case{border-top:1px solid var(--line);background:#fff}.case:first-child{border-top:0}.head{display:grid;grid-template-columns:80px minmax(150px,1.2fr) minmax(100px,.7fr) minmax(100px,.7fr) 80px;gap:14px;align-items:center;padding:15px;cursor:pointer}.head:hover{background:#f7fbff}.label{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.bn{color:#136ab7;font-size:23px;font-weight:950}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf3ff;color:#1563aa;font-size:12px;font-weight:850}.detail{display:none;padding:17px;border-top:1px solid var(--line);background:#f8fbfe}.case.open .detail{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{padding:12px;border:1px solid var(--line);border-radius:10px;background:white;white-space:pre-wrap;overflow-wrap:anywhere}.wide{grid-column:1/-1}.edit{display:grid;grid-template-columns:180px 1fr 2fr auto;gap:10px;margin-top:14px}.edit input,.edit select,.edit textarea{width:100%;padding:11px;border:1px solid #bed0e2;border-radius:9px;background:#fff;color:var(--ink)}.edit textarea{min-height:44px;resize:vertical}.update{border:0;border-radius:9px;padding:11px 18px;color:white;background:var(--brand);font-weight:900}.hotel-fields{display:none;grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:13px;border:1px solid #b9dfd4;border-radius:11px;background:#effaf7}.edit.hotel-selected .hotel-fields{display:grid}.hotel-fields label{color:var(--muted);font-size:11px;font-weight:850}.hotel-fields label span{display:block;margin-bottom:5px}.hotel-address{grid-column:span 2}.updated{display:block;margin-top:10px;color:var(--muted)}
@media(max-width:800px){body{padding-left:0}.sidebar{position:sticky;width:100%;height:auto;padding:12px 12px 7px;flex-direction:row;align-items:center}.brand{font-size:18px}.kicker,.side-bottom{display:none}.nav{display:flex;margin-left:auto;overflow-x:auto}.nav button{width:auto;min-width:max-content;padding:9px}.nav button span:not(.count){display:none}.workspace{padding:12px}.card{min-height:calc(100vh - 80px);padding:14px}.topbar{align-items:flex-start;flex-wrap:wrap}.search{order:2;margin-left:0;width:100%}.summary{grid-template-columns:repeat(3,1fr)}.summary button{grid-template-columns:1fr;gap:5px;padding:10px}.summary .icon{display:none}.summary strong{font-size:22px}.head{grid-template-columns:70px 1fr}.head>div:nth-child(n+3){display:none}.grid,.edit,.hotel-fields{grid-template-columns:1fr}.wide,.hotel-address{grid-column:auto}}
</style></head>
<body>
<aside class="sidebar"><a class="brand" href="index.html">MUFC</a><div class="kicker">Passenger Operations</div><nav class="nav" aria-label="Case status"><button class="active" data-view="Waiting"><svg viewBox="0 0 24 24"><path d="M5 3h14v5l-5 4 5 4v5H5v-5l5-4-5-4z"/></svg><span>Waiting</span><b class="count">0</b></button><button data-view="In Progress"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-5 8 5v12zM9 20v-7h6v7"/></svg><span>In Progress</span><b class="count">0</b></button><button data-view="Hotel"><svg viewBox="0 0 24 24"><path d="M3 20V5h8v15M11 10h10v10M6 9h2M6 13h2M6 17h2M15 14h2M15 17h2"/></svg><span>Hotel</span><b class="count">0</b></button></nav><div class="side-bottom"><button class="side-action" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6 9a7 7 0 0 1 12-3l2 5M4 13l2 5a7 7 0 0 0 12-3"/></svg>Refresh</button><button class="side-action" id="logout"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 9l4 3-4 3M18 12H9"/></svg>Logout</button></div></aside>
<main class="workspace"><section class="card"><div class="topbar"><div><h1 id="title">Waiting</h1><small id="subtitle">New passenger submissions</small></div><input class="search" id="search" placeholder="Search BN, name, destination, ticket…"></div><div class="summary"><button class="active" data-view="Waiting"><span class="icon">⌛</span><span><b>Waiting</b><small>Passenger filed</small></span><strong data-count="Waiting">0</strong></button><button data-view="In Progress"><span class="icon">↻</span><span><b>In Progress</b><small>Being handled</small></span><strong data-count="In Progress">0</strong></button><button data-view="Hotel"><span class="icon">H</span><span><b>Hotel</b><small>Accommodation</small></span><strong data-count="Hotel">0</strong></button></div><section class="panel"><div class="panel-title" id="panel-title">Waiting <span>(0)</span></div><div class="cases" id="cases"><div class="empty">Loading cases…</div></div></section></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js" onerror="this.remove()"></script><script>
const apiBase=(window.MU_API_BASE||'https://api.mufcapp.net').replace(/\/$/,''),casesEl=document.querySelector('#cases'),search=document.querySelector('#search');let rows=[],expanded=new Set(),loading=false,currentView='Waiting';
const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));function loginUrl(){const url=new URL('login.html',location.href);url.searchParams.set('next',location.pathname+location.search);return url.href}const auth=window.firebase?.apps?.length&&window.firebase?.auth?firebase.auth():null;if(auth)auth.onAuthStateChanged(user=>{if(!user)location.replace(loginUrl())});
const normalizedStatus=row=>['In Progress','Hotel'].includes(row.status)?row.status:'Waiting';
function selectView(view){currentView=view;document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));document.querySelector('#title').textContent=view;document.querySelector('#subtitle').textContent=view==='Waiting'?'New passenger submissions':view==='Hotel'?'Passengers assigned accommodation':'Cases currently being handled';render()}
function render(){for(const view of ['Waiting','In Progress','Hotel']){const count=rows.filter(row=>normalizedStatus(row)===view).length;document.querySelectorAll(`[data-count="${view}"],.nav [data-view="${view}"] .count`).forEach(el=>el.textContent=count)}const q=search.value.trim().toLowerCase(),visible=rows.filter(row=>normalizedStatus(row)===currentView&&Object.values(row).join(' ').toLowerCase().includes(q)).slice().reverse();document.querySelector('#panel-title').innerHTML=`${esc(currentView)} <span>(${visible.length})</span>`;if(!visible.length){casesEl.innerHTML='<div class="empty">No matching cases.</div>';return}casesEl.innerHTML=visible.map(row=>{const open=expanded.has(row.rowNumber);return `<article class="case ${open?'open':''}" data-row="${row.rowNumber}"><div class="head" data-toggle><div><span class="label">BN</span><span class="bn">${esc(row.bn)}</span></div><div><span class="label">Passenger</span><strong>${esc(row.passengerName)||'—'}</strong></div><div><span class="label">Status</span><span class="pill">${esc(normalizedStatus(row))}</span></div><div><span class="label">Destination</span>${esc(row.finalDestination)||'—'}</div><div><span class="label">Submitted</span>${esc(new Date(row.submittedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}</div></div><div class="detail"><div class="grid"><div class="box"><span class="label">Contact</span>${esc(row.phone)}<br>${esc(row.email)}</div><div class="box"><span class="label">Travel party / Companion BN</span>${esc(row.travelParty)} · ${esc(row.companionBns)||'—'}</div><div class="box wide"><span class="label">Passenger intention</span>${esc(row.intention)}</div><div class="box wide"><span class="label">PNR record</span>${esc(row.pnrRecord)||'No record'}</div>${row.companionPnrRecords?`<div class="box wide"><span class="label">Companion PNR records</span>${esc(row.companionPnrRecords)}</div>`:''}</div><form class="edit ${normalizedStatus(row)==='Hotel'?'hotel-selected':''}"><select name="status"><option>Waiting</option><option>In Progress</option><option>Hotel</option></select><input name="newTicketNumber" value="${esc(row.newTicketNumber)}" placeholder="New ticket number"><textarea name="comment" placeholder="Comment / 留言">${esc(row.comment)}</textarea><button class="update">Update</button><div class="hotel-fields"><label><span>Hotel name *</span><input name="hotelName" value="${esc(row.hotelName)}" placeholder="Hotel provided to passenger"></label><label class="hotel-address"><span>Hotel address</span><input name="hotelAddress" value="${esc(row.hotelAddress)}" placeholder="Address / shuttle instructions"></label><label><span>Confirmation number</span><input name="hotelConfirmation" value="${esc(row.hotelConfirmation)}"></label><label><span>Check-in</span><input name="hotelCheckIn" type="datetime-local" value="${esc(row.hotelCheckIn)}"></label><label><span>Check-out</span><input name="hotelCheckOut" type="datetime-local" value="${esc(row.hotelCheckOut)}"></label></div></form><small class="updated">Last update: ${esc(row.updatedAt||'—')} ${row.updatedBy?'by '+esc(row.updatedBy):''}</small></div></article>`}).join('')}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>selectView(button.dataset.view));casesEl.onclick=event=>{const toggle=event.target.closest('[data-toggle]');if(!toggle)return;const number=Number(toggle.closest('.case').dataset.row);expanded.has(number)?expanded.delete(number):expanded.add(number);render()};casesEl.onchange=event=>{if(event.target.name!=='status')return;const form=event.target.closest('.edit');form.classList.toggle('hotel-selected',event.target.value==='Hotel');form.querySelector('[name="hotelName"]').required=event.target.value==='Hotel'};casesEl.onsubmit=async event=>{event.preventDefault();const form=event.target,rowNumber=Number(form.closest('.case').dataset.row),button=form.querySelector('.update'),body=Object.fromEntries(new FormData(form));if(body.status==='Hotel'&&!body.hotelName.trim()){alert('Please enter the hotel provided to the passenger.');return}body.updatedBy=auth?.currentUser?.email||'Agent';button.disabled=true;button.textContent='Saving…';try{const response=await fetch(`${apiBase}/record-cases/${rowNumber}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await response.json();if(!response.ok)throw new Error(result.error);rows=rows.map(row=>row.rowNumber===rowNumber?result.record:row);selectView(normalizedStatus(result.record))}catch(error){alert(error.message)}finally{if(button.isConnected){button.disabled=false;button.textContent='Update'}}};
async function load(){if(loading)return;loading=true;try{const response=await fetch(`${apiBase}/record-cases`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error);rows=data.rows||[];render()}catch(error){casesEl.innerHTML=`<div class="empty">${esc(error.message)}</div>`}finally{loading=false}}search.oninput=render;document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=()=>auth?auth.signOut().then(()=>location.replace(loginUrl())):location.replace(loginUrl());load();setInterval(load,5000);
</script></body></html>
