<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baggage Assistance | 行李服务</title>
  <style>
    :root{--navy:#092d57;--red:#dc2538;--ink:#142033;--muted:#637083;--line:#dbe4ee}
    *{box-sizing:border-box}html[lang="zh-CN"] .en,html[lang="en"] .zh{display:none}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:radial-gradient(circle at 15% 0,#d9ebfb 0,transparent 33%),linear-gradient(145deg,#f6f9fc,#eaf2f9)}
    .topbar{height:7px;background:linear-gradient(90deg,var(--navy) 0 67%,var(--red) 67%)}
    header{display:flex;align-items:center;gap:14px;width:min(860px,calc(100% - 32px));margin:28px auto 18px}.mark{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;color:#fff;font-size:19px;font-weight:900;letter-spacing:.06em;background:var(--navy);box-shadow:0 12px 24px #092d5730}header strong{display:block;color:var(--navy);font-size:17px}header span{color:var(--muted);font-size:13px}.language-toggle{margin-left:auto;padding:10px 15px;color:var(--navy);font:800 14px inherit;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
    main{width:min(860px,calc(100% - 32px));margin:0 auto 56px}.card{overflow:hidden;padding:clamp(25px,5vw,46px);border:1px solid #fff;border-radius:26px;background:#fffffff5;box-shadow:0 24px 65px #173b5d1c}h1{margin:0 0 10px;color:var(--navy);font-size:clamp(29px,5vw,42px)}.intro{margin:0 0 28px;color:var(--muted);line-height:1.65}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.choice{display:flex;min-height:220px;padding:24px;flex-direction:column;color:#fff;text-decoration:none;border:1px solid #ffffff24;border-radius:20px;box-shadow:0 14px 30px #092d5724;transition:.2s}.choice--delayed{background:linear-gradient(145deg,#503d78,#342653)}.choice--damaged{background:linear-gradient(145deg,#7b3845,#54232e)}.choice:hover,.choice:focus-visible{box-shadow:0 19px 36px #092d5740;transform:translateY(-4px);outline:3px solid #ffffff80;outline-offset:-4px}.icon{display:grid;place-items:center;width:52px;height:52px;margin-bottom:20px;border-radius:15px;color:#fff;background:#ffffff18;border:1px solid #ffffff2e}.icon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.choice strong{color:#fff;font-size:19px;line-height:1.25}.choice p{margin:8px 0 18px;color:#eef5ff;font-size:13px;line-height:1.55}.go{margin-top:auto;color:#fff;font-weight:850;font-size:13px}
    @media(max-width:700px){.choices{grid-template-columns:1fr}.choice{min-height:0}.icon{margin-bottom:14px}header{margin-top:20px}}
  </style>
  <link rel="stylesheet" href="/aviation-glass.css?v=20261013-pickers">
  <link rel="stylesheet" href="/assets/boarding-aurora.css?v=20261013-ce777-mobile-small">
<link rel="stylesheet" href="/assets/mobile-cloud-layout.css?v=20261013-safe-plane">
  <link rel="stylesheet" href="/assets/cbs-service-cards.css?v=20261014-clean-corners">
<link rel="stylesheet" href="/assets/cbs-report.css?v=20261015"><link rel="stylesheet" href="/assets/cbs-3d-artwork.css?v=20261018-3d">
</head>
<body class="aviation-page aviation-baggage">
  <header><button class="language-toggle" id="language-toggle" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></svg><span id="language-label">English</span></button><div class="mobile-aircraft-sky" aria-hidden="true"></div></header>
  <main><section class="card"><div class="service-hero"><h1><span class="baggage-title-zh">行李服务</span><span class="baggage-title-en" lang="en">Baggage Assistance</span></h1><p class="intro"><span class="zh">我们随时为您提供帮助。请选择行李问题类型，开始填写报告。</span><span class="en">We're here to help. Choose the issue with your baggage to get started.</span></p>
    </div><nav class="choices" aria-label="Baggage assistance options">
      <a class="choice choice--delayed" href="pir-form.html?type=AHL"><img class="choice-art" src="/assets/cbs-3d-delayed.webp" width="1536" height="512" alt=""><strong><span class="zh">行李延误／遗失</span><span class="en">Delayed / Lost</span></strong><span class="go"><span class="zh">填写报告</span><span class="en">Open a report</span></span></a>
      <a class="choice choice--damaged" href="pir-form.html?type=DPR"><img class="choice-art" src="/assets/cbs-3d-damaged.webp" width="1536" height="512" alt=""><strong><span class="zh">行李损坏</span><span class="en">Damaged</span></strong><span class="go"><span class="zh">填写报告</span><span class="en">Open a report</span></span></a>
    </nav>
  </section></main>
  <script>const toggle=document.querySelector('#language-toggle');function setLanguage(lang){document.documentElement.lang=lang;document.querySelectorAll('.choice').forEach(link=>{const url=new URL(link.href);url.searchParams.set('lang',lang==='en'?'en':'zh');link.href=url.href});document.querySelector('#language-label').textContent=lang==='zh-CN'?'English':'中文'}toggle.addEventListener('click',()=>setLanguage(document.documentElement.lang==='zh-CN'?'en':'zh-CN'));setLanguage(new URLSearchParams(location.search).get('lang')==='en'?'en':'zh-CN');</script>
</body></html>
