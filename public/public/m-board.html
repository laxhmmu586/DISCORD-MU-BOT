<!doctype html>
<html lang="en">
<head>
    <script src="/flight-session.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manual</title>
  <link rel="stylesheet" href="/nbrd-review.css?v=20261014-honeycomb-six"><script src="/nbrd-review.js?v=20261014-numeric-sort"></script>
  <style>
    :root { --brand:#123a73; --line:#d7e1ec; --ink:#172033; --muted:#667085; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Arial,"Noto Sans SC",sans-serif; background:linear-gradient(135deg,#eaf4ff,#fdfefe); color:var(--ink); }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px clamp(18px,4vw,52px); background:rgba(255,255,255,.92); border-bottom:1px solid var(--line); }
    .brand { font-weight:900; color:var(--brand); letter-spacing:.08em; text-decoration:none; }
    main { width:min(1100px,94vw); margin:28px auto; display:grid; gap:18px; }
    .button,button { border:0; border-radius:999px; padding:12px 18px; font-weight:850; cursor:pointer; background:var(--brand); color:white; text-decoration:none; }
    .card { background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 42px rgba(22,48,76,.08); padding:22px; overflow:hidden; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar h1 { display:flex; align-items:center; gap:10px; }
    .aviation-board main { padding-top:14px; }
    .board-toolbar-actions { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .aviation-board .board-toolbar-actions a.button { background:#ffffffb3; color:#064fca; border:1px solid #fff; box-shadow:none; }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    tr.is-new td { background:#fff7db; box-shadow:inset 0 0 0 9999px rgba(255,213,79,.18); }
    h1 { margin:0; font-size:clamp(32px,6vw,56px); }
    .status { color:var(--muted); font-weight:800; }
    .status.err { color:var(--danger); }
    .board-section { display:grid; gap:10px; margin-top:18px; }
    .board-section h2 { margin:0; font-size:22px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:16px; }
    table { width:100%; border-collapse:collapse; min-width:420px; background:white; }
    th,td { padding:12px 14px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { position:sticky; top:0; background:#f5f8fc; color:#344054; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    tr:last-child td { border-bottom:0; }
    .empty { padding:28px; color:var(--muted); font-weight:800; text-align:center; }
    .nbrd { color:#b42318; font-weight:900; }
    .infant { color:var(--brand); font-weight:900; }
    tr[data-row-number] { cursor:pointer; }
    tr.is-entered td { background:#e8f7ed; color:#087443; font-weight:900; }
    tr.is-entered td:first-child { border-left:5px solid #087443; }
    .aviation-board button.clear-board.secondary { justify-self:start;color:var(--danger);border:1px solid #f5b9b4;background:#fff3f2;box-shadow:none; }
  </style>
  <link rel="stylesheet" href="/aviation-glass.css?v=20261014-honeycomb-six">
  <link rel="stylesheet" href="/assets/boarding-aurora.css?v=20261013-ce777-mobile-small">
<link rel="stylesheet" href="/assets/mobile-cloud-layout.css?v=20261013-safe-plane"><link rel="stylesheet" href="/assets/boarding-scan.css?v=20261013-wide-accent">
  <link rel="stylesheet" href="/assets/manual-board.css?v=20261015-two-columns">
</head>
<body class="aviation-page aviation-board">
  <main>
    <section class="card">
      <div class="toolbar"><h1><span class="boarding-live-indicator" id="boarding-live-indicator" role="status" aria-label="Live boarding connection" hidden></span>Manual</h1><div class="board-toolbar-actions"><a class="button secondary" href="/scan.html">Boarding</a><button class="refresh-board" id="refresh" type="button">Refresh</button></div></div>
      <p class="status" id="status" hidden></p>
      <div class="board-section"><h2>NBRD</h2><div id="nbrd-wrap"><div class="empty">Loading NBRD...</div></div></div>
      <div class="board-section manual-scan-section">
        <div class="manual-scan-tabs" role="tablist" aria-label="Scan records">
          <button id="boarding-tab" type="button" role="tab" aria-controls="boarding-panel" aria-selected="true">Boarding</button>
          <button id="infant-tab" type="button" role="tab" aria-controls="infant-panel" aria-selected="false" tabindex="-1">Infant</button>
        </div>
        <div id="boarding-panel" class="boarding-scan" role="tabpanel" aria-labelledby="boarding-tab"><div class="table-wrap" id="table-wrap"><div class="empty">Loading boarding records...</div></div></div>
        <div id="infant-panel" role="tabpanel" aria-labelledby="infant-tab" hidden><div class="table-wrap" id="infant-wrap"><div class="empty">Loading infant scans...</div></div></div>
      </div>
      <div class="board-section"><button class="secondary clear-board" id="clear-board" type="button">手动清空当前航班</button></div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/boarding-live.js?v=20261011"></script>
  <script>
    const auth = window.firebase?.apps?.length && window.firebase?.auth ? firebase.auth() : null;
    const AUTH_SESSION_STARTED_KEY = 'mufc_auth_session_started_at';
    const AUTH_LAST_ACTIVITY_KEY = 'mufc_auth_last_activity_at';
    function loginUrl() {
      const url = new URL('login.html', window.location.href);
      url.searchParams.set('next', `${window.location.pathname}${window.location.search}${window.location.hash}`);
      return url.href;
    }
    function markAuthActivity() {
      (window.localStorage || window.sessionStorage).setItem(AUTH_LAST_ACTIVITY_KEY, String(Date.now()));
    }
    function requireLogin() {
      if (!auth) { window.location.replace(loginUrl()); return; }
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          window.location.replace(loginUrl());
          return;
        }
        markAuthActivity();
      });
    }
    requireLogin();
    const apiBase = (window.MU_API_BASE || 'https://api.mufcapp.net').replace(/\/$/, '');
    const statusEl = document.querySelector('#status');
    const tableWrap = document.querySelector('#table-wrap');
    const nbrdWrap = document.querySelector('#nbrd-wrap');
    const infantWrap = document.querySelector('#infant-wrap');
    const scanTabs = [...document.querySelectorAll('.manual-scan-tabs [role="tab"]')];
    function selectScanTab(tab, focus = false) {
      scanTabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
      });
      if (focus) tab.focus();
    }
    scanTabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectScanTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? scanTabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + scanTabs.length) % scanTabs.length;
        selectScanTab(scanTabs[next], true);
      });
    });
    const refreshButtons = [...document.querySelectorAll('.refresh-board')];
    let currentRecordKeys = new Set();
    let boardRevision = -1;
    let boardMutationRunning = false;
    let deferredBoard = null;
    const boardingLiveIndicator = document.querySelector('#boarding-live-indicator');
    function applyLiveBoard(data) {
      if (boardMutationRunning) { deferredBoard = data; return; }
      if (data.revision < boardRevision) return;
      boardRevision = data.revision;
      renderRows(data.rows || []);
      setStatus('');
    }
    function finishBoardMutation() {
      boardMutationRunning = false;
      if (deferredBoard) { const data = deferredBoard; deferredBoard = null; applyLiveBoard(data); }
    }
    function setStatus(text, isError = false) { statusEl.textContent = text; statusEl.hidden = !text; statusEl.className = `status ${isError ? 'err' : ''}`.trim(); }
    function recordKey(type, row) {
      if (row.rowNumber) return `${type}:${row.rowNumber}`;
      if (type === 'nbrd') return `${type}:${row.nbrdBn || ''}:${row.nbrdDetail || ''}`;
      if (type === 'infant') return `${type}:${row.infantBn || ''}:${row.infantSeat || ''}:${row.infantScannedAt || ''}`;
      return `${type}:${row.bn || ''}:${row.seat || ''}:${row.flight || ''}`;
    }
    const nbrdReview = NbrdReview.create({container:nbrdWrap, apiBase, onChanged:async()=>{ await loadBoard(); }});
    function renderNbrdRows(rows) { nbrdReview.render(rows); }
    function renderBnGrid(container, type, rows, newKeys) {
      if (!rows.length) {
        container.innerHTML = '<div class="empty">' + (type === 'scan' ? 'No boarding scan rows found.' : 'No infant scans found.') + '</div>';
        return;
      }
      if (!container.querySelector('.bn-grid')) container.innerHTML = '<div class="bn-heading">BN</div><div class="bn-grid"></div>';
      const grid = container.querySelector('.bn-grid');
      const existing = new Map([...grid.children].map((cell) => [cell.dataset.recordKey, cell]));
      const nextKeys = new Set(rows.map((row) => recordKey(type, row)));
      existing.forEach((cell, key) => { if (!nextKeys.has(key)) cell.remove(); });
      rows.forEach((row, index) => {
        const key = recordKey(type, row);
        let cell = existing.get(key);
        if (!cell) {
          cell = document.createElement(type === 'scan' ? 'button' : 'div');
          if (type === 'scan') cell.type = 'button';
          cell.className = type === 'scan' ? 'bn-cell' : 'bn-cell infant';
          cell.dataset.recordKey = key;
        }
        cell.dataset.rowNumber = row.rowNumber || '';
        cell.dataset.rowIndex = index;
        const bn = String((type === 'scan' ? row.bn : row.infantBn) || '');
        if (cell.textContent !== bn) cell.textContent = bn;
        cell.classList.toggle('is-entered', Boolean(row.entered));
        cell.classList.toggle('is-new', newKeys.has(key));
        if (type === 'scan') cell.setAttribute('aria-label', `Mark boarding through BN ${bn}`);
        if (grid.children[index] !== cell) grid.insertBefore(cell, grid.children[index] || null);
      });
    }
    function renderScanRows(rows, newKeys) {
      renderBnGrid(tableWrap, 'scan', rows, newKeys);
    }
    function renderInfantRows(rows, newKeys) {
      renderBnGrid(infantWrap, 'infant', rows, newKeys);
    }
    function setRefreshDisabled(disabled) {
      refreshButtons.forEach((button) => { button.disabled = disabled; });
    }
    function collectRecordKeys(nbrdRows, scanRows, infantRows) {
      return new Set([
        ...nbrdRows.map((row) => recordKey('nbrd', row)),
        ...scanRows.map((row) => recordKey('scan', row)),
        ...infantRows.map((row) => recordKey('infant', row)),
      ]);
    }
    function renderRows(rows, newKeys = new Set()) {
      const nbrdRows = rows.filter((row) => row.nbrdBn);
      const scanRows = rows.filter((row) => row.bn || row.seat || row.flight);
      const infantRows = rows.filter((row) => row.infantBn || row.infantSeat || row.infantFlight || row.infantScannedAt);
      renderNbrdRows(nbrdRows, newKeys);
      renderScanRows(scanRows, newKeys);
      renderInfantRows(infantRows, newKeys);
      currentRecordKeys = collectRecordKeys(nbrdRows, scanRows, infantRows);
      return { nbrdRows, scanRows, infantRows };
    }
    function scrollToLatestRecord() {
      const panel = document.querySelector('[role="tabpanel"]:not([hidden])');
      const rows = [...(panel?.querySelectorAll('.bn-cell[data-record-key]') || [])];
      const latestRow = rows[rows.length - 1];
      latestRow?.scrollIntoView({ behavior:'smooth', block:'center' });
      return Boolean(latestRow);
    }
    async function loadBoard({ scrollToLatest = false } = {}) {
      const previousRecordKeys = new Set(currentRecordKeys);
      try {
        setRefreshDisabled(true);
        setStatus('Loading...');
        const res = await fetch(`${apiBase}/cbs-scan/records`, { cache:'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Load failed');
        if (data.live && data.revision < boardRevision) return;
        if (data.live) boardRevision = data.revision;
        const rows = data.rows || [];
        const nextRecordKeys = collectRecordKeys(
          rows.filter((row) => row.nbrdBn),
          rows.filter((row) => row.bn || row.seat || row.flight),
          rows.filter((row) => row.infantBn || row.infantSeat || row.infantFlight || row.infantScannedAt),
        );
        const newKeys = scrollToLatest ? new Set([...nextRecordKeys].filter((key) => !previousRecordKeys.has(key))) : new Set();
        renderRows(rows, newKeys);
        if (scrollToLatest) scrollToLatestRecord();
        setStatus('');
      } catch (err) {
        nbrdWrap.innerHTML = '<div class="empty">Unable to load NBRD rows.</div>';
        tableWrap.innerHTML = '<div class="empty">Unable to load boarding records.</div>';
        infantWrap.innerHTML = '<div class="empty">Unable to load infant scans.</div>';
        setStatus(err.message || 'Load failed', true);
      } finally {
        setRefreshDisabled(false);
      }
    }
    async function updateEnteredRows(rowNumbers, entered) {
      if (!rowNumbers.length) return;
      const res = await fetch(`${apiBase}/cbs-scan/records/entered`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ rowNumbers, entered }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Unable to update row colors.');
    }

    nbrdWrap.addEventListener('click', async (event) => {
      if (boardMutationRunning) return;
      const button = event.target.closest('[data-nbrd-row]');
      if (!button) return;
      const rowNumber = button.dataset.nbrdRow;
      const bn = button.dataset.nbrdBn || '';
      if (!window.confirm(`Delete NBRD BN ${bn}?`)) return;
      try {
        button.disabled = true;
        boardMutationRunning = true;
        setStatus(`Deleting NBRD BN ${bn}...`);
        const res = await fetch(`${apiBase}/cbs-scan/nbrd-bns/${encodeURIComponent(rowNumber)}/delete`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ bn }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Unable to delete NBRD BN.');
        const tableRow = button.closest('tr');
        const tableBody = tableRow?.parentElement;
        tableRow?.remove();
        if (tableBody && !tableBody.querySelector('tr')) renderNbrdRows([]);
        setStatus(`Deleted NBRD BN ${bn}.`);
      } catch (err) {
        button.disabled = false;
        setStatus(err.message || 'Unable to delete NBRD BN.', true);
      } finally {
        finishBoardMutation();
      }
    });
    tableWrap.addEventListener('click', async (event) => {
      if (boardMutationRunning) return;
      const row = event.target.closest('.bn-cell[data-row-index]');
      if (!row) return;
      const targetIndex = Number(row.dataset.rowIndex);
      const rows = [...tableWrap.querySelectorAll('.bn-cell[data-row-index]')];
      const doneRows = rows.filter((item) => Number(item.dataset.rowIndex) <= targetIndex);
      const openRows = rows.filter((item) => Number(item.dataset.rowIndex) > targetIndex);
      const doneRowNumbers = doneRows.map((item) => Number(item.dataset.rowNumber)).filter(Boolean);
      const openRowNumbers = openRows.map((item) => Number(item.dataset.rowNumber)).filter(Boolean);
      try {
        boardMutationRunning = true;
        setStatus('Updating boarding status...');
        await updateEnteredRows(doneRowNumbers, true);
        await updateEnteredRows(openRowNumbers, false);
        doneRows.forEach((item) => item.classList.add('is-entered'));
        openRows.forEach((item) => item.classList.remove('is-entered'));
        setStatus(`Marked through BN ${row.textContent || ''}.`);
      } catch (err) {
        // A failed second request may leave the first saved; display persisted state.
        await loadBoard();
        setStatus(err.message || 'Unable to update row colors.', true);
      } finally {
        finishBoardMutation();
      }
    });
    const clearBoardButton = document.querySelector('#clear-board');
    clearBoardButton.addEventListener('click', async () => {
      if (boardMutationRunning) return;
      const flight = window.mufcFlight;
      if (!flight) { setStatus('Please select a flight first.', true); return; }
      if (!window.confirm('确认清空 ' + flight.flightNo + ' · ' + flight.flightDate + ' 的 Boarding Scan、Infant Scan 和 NBRD？清空后无法恢复。')) return;
      clearBoardButton.disabled = true;
      setRefreshDisabled(true);
      boardMutationRunning = true;
      try {
        setStatus('正在清空当前航班...');
        const res = await fetch(apiBase + '/cbs-scan/clear', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ confirm:true, flightNo:flight.flightNo, flightDate:flight.flightDate })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Unable to clear boarding data.');
        renderRows([]);
        setStatus('已清空 ' + flight.flightNo + ' · ' + flight.flightDate + '。');
      } catch (err) { setStatus(err.message || 'Unable to clear boarding data.', true); }
      finally { finishBoardMutation(); clearBoardButton.disabled = false; setRefreshDisabled(false); }
    });
    refreshButtons.forEach((button) => button.addEventListener('click', () => loadBoard({ scrollToLatest:true })));
    connectBoardingLive({ apiBase, onBoard: applyLiveBoard, onStatus: status => { boardingLiveIndicator.hidden = status !== 'Live'; } })
      .then(live => { if (!live) loadBoard(); });
  </script>
</body>
</html>
