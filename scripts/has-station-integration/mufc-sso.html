<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MUFC · HAS Station</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js"></script>
<style>body{font:18px system-ui;background:#edf5ff;color:#17395f;padding:10vh 8vw}main{max-width:640px}p{line-height:1.6}</style></head><body><main><h1>Opening your workspace</h1><p id="status" role="status">Verifying your MUFC sign-in…</p></main><script>
(async()=>{const code=new URLSearchParams(location.hash.slice(1)).get('code');history.replaceState(null,'',location.pathname);try{if(!code)throw Error('Open this workspace from MUFC.');const response=await fetch('/mufc-sso/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const result=await response.json();if(!response.ok)throw Error(result.error||'Unable to sign in.');await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);await firebase.auth().signInWithCustomToken(result.customToken);location.replace(result.path);}catch(e){document.getElementById('status').textContent=e.message;}})();
</script></body></html>
